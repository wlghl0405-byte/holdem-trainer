<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="육지덤">
<meta name="theme-color" content="#0B0E0D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>육지덤</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#0B0E0D; --panel:#13181A; --panel-2:#1A2124; --line:#242D30; --line-2:#313C40;
  --ink:#E9EDEB; --ink-2:#93A09A; --mute:#5F6C68;
  --felt:#15402F; --felt-hi:#1D543E; --rail:#2C2118; --rail-hi:#3B2D20;
  --gold:#C9A227; --gold-soft:rgba(201,162,39,.14);
  --card:#F6F4EC; --card-ink:#171A19; --card-red:#B23C31;
  --good:#3E9E6E; --bad:#C0483C; --info:#4B84D8;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"Noto Sans KR","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.5; letter-spacing:-.01em; word-break:keep-all; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* 서체: Noto Sans KR (없으면 시스템 고딕) */
.seat .act{line-height:1.25;display:inline-flex;align-items:center;gap:3px}
.seat .bet{display:inline-flex;align-items:center;line-height:1}
.seat .plate .nm{line-height:1.3}
.abtn{line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.msg .pill{line-height:1.3}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ── 레이아웃 ── */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:15px;font-weight:750;letter-spacing:-.02em}
header h1 span{color:var(--gold)}
.hstat{display:flex;gap:16px;margin-left:auto;align-items:center;font-size:12.5px;color:var(--ink-2)}
.hstat b{color:var(--ink);font-weight:700}
.tbtn{border:1px solid var(--line-2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:650;color:var(--ink-2);background:var(--panel-2)}
.tbtn:hover{color:var(--ink);border-color:var(--gold)}
.tbtn.on{background:var(--gold);color:#20180A;border-color:transparent}

main{display:grid;grid-template-columns:1fr 340px;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 16px 0}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px}

/* ── 테이블 ── */
.tablewrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.felt{
  position:relative;width:min(100%,860px);aspect-ratio:16/9;border-radius:46% / 52%;
  background:radial-gradient(ellipse at 50% 44%, var(--felt-hi) 0%, var(--felt) 58%, #0F3325 100%);
  border:13px solid var(--rail);
  box-shadow:0 0 0 2px #0A0D0C inset, 0 22px 60px rgba(0,0,0,.55), 0 0 0 1px var(--rail-hi);
}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:82%;z-index:3}
.potline{font-size:12px;color:rgba(255,255,255,.5);font-weight:650;letter-spacing:.04em}
.pot{font-size:22px;font-weight:800;color:var(--gold)}
.potrow{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:10px}
.potrow .stagetag{margin:0 0 0 6px;padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}
.board{display:flex;gap:7px;justify-content:center;margin-top:0;min-height:78px}
.stagetag{margin-top:8px;font-size:11.5px;color:rgba(255,255,255,.42);font-weight:650}

/* 카드 */
.card{width:54px;height:76px;border-radius:7px;background:var(--card);color:var(--card-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  box-shadow:0 3px 10px rgba(0,0,0,.4);flex:0 0 auto;font-weight:750;user-select:none}
.card .rk{font-size:20px;line-height:1}
.card .st{font-size:19px;line-height:1;margin-top:1px}
.card.red{color:var(--card-red)}
.card.sm{width:38px;height:54px;border-radius:5px}
.card.sm .rk{font-size:14px}.card.sm .st{font-size:13px}
.card.xs{width:26px;height:36px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.card.xs .rk{font-size:10.5px}.card.xs .st{font-size:10px}
.card.back{background:repeating-linear-gradient(45deg,#2E4A63 0 5px,#24394D 5px 10px);border:2px solid #14202B;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.card.best{box-shadow:0 0 0 2px var(--gold), 0 3px 12px rgba(201,162,39,.4)}
.card.ph{background:rgba(255,255,255,.05);box-shadow:none;border:1px dashed rgba(255,255,255,.14)}
.deal{animation:deal .28s cubic-bezier(.2,.8,.2,1)}
@keyframes deal{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1}}

/* ── 이펙트 (카드 뒤집기·차례 펄스·베팅 팝·팟 튐·올인 섬광·승자 후광·칩 날아가기·WIN 색종이) ── */
@keyframes flipin{0%{opacity:0;transform:perspective(600px) rotateY(-90deg) translateY(-6px)}55%{opacity:1}100%{transform:perspective(600px) rotateY(0) translateY(0)}}
.board .card.deal,.hero .card.deal,.seat .card.deal{animation:flipin .46s cubic-bezier(.2,.8,.25,1) both}
.board .card.deal:nth-child(2){animation-delay:.09s}.board .card.deal:nth-child(3){animation-delay:.18s}
.hero .card.deal:nth-child(2){animation-delay:.12s}
@keyframes turnpulse{0%,100%{box-shadow:0 0 0 3px var(--gold-soft),0 0 10px rgba(201,162,39,.2)}50%{box-shadow:0 0 0 4px rgba(201,162,39,.45),0 0 24px rgba(201,162,39,.65)}}
.seat.turn .plate{animation:turnpulse 1.3s ease-in-out infinite}
.hero.turn .cards .card{box-shadow:0 0 0 2px var(--gold),0 0 20px rgba(201,162,39,.55)}
@keyframes heropulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,39,0)}50%{box-shadow:0 0 0 6px rgba(201,162,39,.12)}}
.hero.turn{border-radius:16px;animation:heropulse 1.3s ease-in-out infinite}
@keyframes badgepop{0%{opacity:0;transform:translateX(-50%) scale(.3)}70%{transform:translateX(-50%) scale(1.15)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
.seat .bet.pop,.seat .act.pop{animation:badgepop .32s cubic-bezier(.2,.9,.3,1.2) both}
.seat .bet::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px;
  background:radial-gradient(circle at 50% 50%,#F3D77A 0 30%,#C9A227 31% 60%,#8A6A12 61%);box-shadow:0 1px 2px rgba(0,0,0,.5)}
@keyframes potbump{0%{transform:scale(1)}40%{transform:scale(1.28);text-shadow:0 0 18px rgba(201,162,39,.9)}100%{transform:scale(1)}}
.pot.bump{display:inline-block;animation:potbump .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes allinflash{0%,100%{box-shadow:0 0 0 0 rgba(192,72,60,0)}50%{box-shadow:0 0 0 5px rgba(192,72,60,.35),0 0 22px rgba(192,72,60,.9)}}
.seat .act.allin{animation:allinflash .7s ease-in-out 4}
@keyframes shake{0%,100%{transform:translate(-50%,-50%) scale(1)}20%{transform:translate(-52%,-50%) scale(1.06) rotate(-2deg)}40%{transform:translate(-48%,-50%) scale(1.06) rotate(2deg)}60%{transform:translate(-51%,-50%) scale(1.04)}80%{transform:translate(-49%,-50%) scale(1.02)}}
.ann.on.allin{animation:shake .5s ease-in-out;box-shadow:0 0 30px rgba(192,72,60,.55)}
.ann.on.raise{box-shadow:0 0 22px rgba(201,162,39,.4)}
@keyframes winglow{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(201,162,39,.4)}50%{box-shadow:0 0 0 3px #F3D77A,0 0 34px rgba(243,215,122,.9)}}
.seat.winner .plate{border-color:var(--gold);animation:winglow 1.1s ease-in-out infinite}
.seat.winner .ch{color:#F3D77A}
.hero.winner .ch{color:#F3D77A;text-shadow:0 0 18px rgba(243,215,122,.8)}
.chip{position:absolute;width:18px;height:18px;border-radius:50%;z-index:10;pointer-events:none;left:50%;top:50%;margin:-9px 0 0 -9px;
  background:radial-gradient(circle at 50% 50%,#fff8 0 18%,transparent 19%),repeating-conic-gradient(var(--c) 0 30deg,#fff 30deg 60deg);
  box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 0 0 4px var(--c);animation:chipfly var(--t,.75s) cubic-bezier(.3,.7,.3,1) forwards;animation-delay:var(--d,0s);opacity:0}
@keyframes chipfly{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1;transform:translate(0,-10px) scale(1.15)}100%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(.85)}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.95;animation:confall 2.4s linear infinite;animation-delay:var(--d)}
@keyframes confall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(.8);opacity:.6}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.rlabel.win{background:linear-gradient(90deg,#C9A227 0%,#FFF1B8 45%,#C9A227 60%,#FFF1B8 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.2s linear infinite;text-shadow:none;filter:drop-shadow(0 0 16px rgba(201,162,39,.55))}
.rcard.win{border-color:rgba(243,215,122,.55);box-shadow:0 20px 56px rgba(0,0,0,.65),0 0 46px rgba(201,162,39,.35)}
.rcard.lose{border-color:rgba(222,106,96,.35)}
.rcard.bust{border-color:rgba(222,106,96,.6);box-shadow:0 20px 56px rgba(0,0,0,.65),0 0 40px rgba(192,72,60,.35)}
.rbust{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(192,72,60,.16);border:1px solid rgba(222,106,96,.45);text-align:center}
.rbtitle{font-size:20px;font-weight:900;color:#F0A29A;letter-spacing:.14em}
.rbsub{font-size:12.5px;color:var(--ink);margin-top:5px;line-height:1.5}
.rbsub b{color:#F3D77A}
.rbn{display:inline-block;margin-left:4px;font-size:11px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:1px 7px}
.ann.rebuy{border-color:#F3D77A;color:#F3D77A;background:rgba(201,162,39,.2);font-size:17px;box-shadow:0 0 30px rgba(201,162,39,.5)}
.ann.rebuy small{font-size:11.5px;color:var(--ink-2);margin-left:6px;font-weight:600}
.abtn.raise:hover,.abtn.call:hover{box-shadow:0 0 18px rgba(201,162,39,.45);filter:brightness(1.06)}
.abtn.allin:hover{box-shadow:0 0 18px rgba(192,72,60,.5)}
.felt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 55%);transition:box-shadow .6s}
/* 올인 쇼다운: 조명을 낮추고 가운데만 밝게, 마지막 카드 전엔 테이블이 두근거린다 */
.felt.drama::after{box-shadow:inset 0 0 180px 90px rgba(0,0,0,.82);background:radial-gradient(ellipse at 50% 50%,rgba(255,240,200,.10),transparent 45%)}
.felt.drama .seat{filter:brightness(.75)}
.felt.drama .center{z-index:3}
@keyframes drum{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 2px),calc(-50% + 1px))}50%{transform:translate(calc(-50% + 2px),calc(-50% - 1px))}75%{transform:translate(calc(-50% - 1px),calc(-50% - 1px))}}
.felt.drum .center{animation:drum .12s linear infinite}
@keyframes phpulse{0%,100%{border-color:rgba(255,255,255,.14);box-shadow:none}50%{border-color:#F3D77A;box-shadow:0 0 22px rgba(243,215,122,.7)}}
.felt.drum .card.ph:first-of-type,.felt.drum .board .ph{animation:phpulse .4s ease-in-out infinite}
.ann.drama{font-size:22px;letter-spacing:.2em;border-color:#F3D77A;color:#F3D77A;background:rgba(0,0,0,.6);box-shadow:0 0 40px rgba(201,162,39,.5)}
@keyframes drumtext{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
.ann.on.drum{font-size:19px;letter-spacing:.3em;border-color:var(--bad);color:#F0A29A;background:rgba(40,8,6,.75);animation:drumtext .35s ease-in-out infinite;box-shadow:0 0 34px rgba(192,72,60,.6)}
@media (prefers-reduced-motion:reduce){.seat.turn .plate,.hero.turn,.seat.winner .plate,.rlabel.win,.pot.bump,.seat .act.allin,.ann.on.allin{animation:none}.chip,.confetti{display:none}}

/* 액션 알림 (누가 무엇을 했는지 크게) */
.ann{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%) scale(.9);z-index:11;
  display:flex;align-items:center;justify-content:center;line-height:1;
  background:rgba(8,13,11,.9);border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:9px 16px;font-size:14px;font-weight:750;white-space:nowrap;color:var(--ink);
  opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.ann .anncard{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:30px;height:42px;background:var(--card);color:var(--card-ink);
  border-radius:5px;margin-left:9px;font-size:14px;font-weight:850;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.ann .anncard .st{font-size:13px}
.ann.stage{padding:6px 14px 6px 16px;border-radius:14px}
.ann .anncard.red{color:var(--card-red)}
.ann.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ann .who{color:var(--ink-2);font-weight:650;margin-right:5px}
.ann.raise{border-color:var(--gold);color:var(--gold)}
.ann.call{border-color:#4B84D8;color:#9FC0F0}
.ann.fold{color:var(--mute)}
.ann.allin{border-color:var(--bad);color:#EFA69E}
.ann.stage{background:rgba(201,162,39,.16);border-color:var(--gold);color:#EBD9A0;font-size:15px;letter-spacing:.04em}

/* 핸드 결과 */
.result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:12;pointer-events:none;padding:12px}
.result.on{display:flex}
.rcard{background:rgba(8,13,11,.9);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:16px 26px 18px;
  text-align:center;backdrop-filter:blur(8px);box-shadow:0 20px 56px rgba(0,0,0,.65);max-width:94%;
  animation:pop .34s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.rlabel{font-size:40px;font-weight:900;letter-spacing:.08em;line-height:1}
.rlabel.win{color:var(--gold);text-shadow:0 0 26px rgba(201,162,39,.45)}
.rlabel.lose{color:#DE6A60}
.rlabel.draw{color:#9FC0F0}
.rlabel.fold{color:#7C8A86;letter-spacing:.1em}
.rdelta.fold{color:var(--ink-2)}
.rdelta{font-size:21px;font-weight:850;margin-top:5px;font-variant-numeric:tabular-nums}
.rdelta.win{color:var(--gold)}.rdelta.lose{color:#DE6A60}.rdelta.draw{color:var(--ink-2)}
.rwho{font-size:13.5px;color:var(--ink);font-weight:700;margin-top:9px}
.rwho b{color:var(--gold)}
.rsub{font-size:12px;color:var(--ink-2);margin-top:3px}
.rcards{display:flex;gap:5px;justify-content:center;margin-top:10px}
.rcards .card{box-shadow:0 3px 10px rgba(0,0,0,.5)}
/* 쇼다운 비교표 */
.rshow{margin-top:11px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:9px;text-align:left}
.rrow .rn{font-size:12.5px;font-weight:800;min-width:44px;color:var(--ink-2)}
.rrow.w .rn{color:var(--gold)}
.rrow .rh{font-size:12.5px;font-weight:700;min-width:96px}
.rrow.w .rh{color:var(--gold)}
.rrow .rc{display:flex;gap:3px;margin-left:auto}
.rrow.w .rc .card{box-shadow:0 0 0 1.5px var(--gold), 0 2px 6px rgba(0,0,0,.5)}
.rhole{display:flex;gap:3px;margin-right:2px;padding-right:7px;border-right:1px dashed rgba(255,255,255,.18)}
@media (prefers-reduced-motion:reduce){.rcard{animation:none}}

/* 좌석 */
.seat{position:absolute;transform:translate(-50%,-50%);width:120px;text-align:center;z-index:2}
.seat .cards{display:flex;gap:4px;justify-content:center;margin-bottom:5px;min-height:54px}
.seat .plate{background:rgba(8,14,12,.82);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:5px 8px}
.seat .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ch{font-size:12.5px;font-weight:750;color:var(--gold);margin-top:1px}
.seat.turn .plate{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.seat.folded{opacity:.4}
.seat.out{opacity:.22;filter:grayscale(1)}
.seat .act{position:absolute;left:50%;transform:translateX(-50%);bottom:-23px;font-size:12px;font-weight:800;
  padding:3px 11px;border-radius:999px;background:rgba(10,16,14,.92);border:1.5px solid var(--line-2);white-space:nowrap;
  box-shadow:0 3px 10px rgba(0,0,0,.45)}
.seat .act.fold{color:var(--mute);border-color:var(--line)}
.seat .act.raise{color:#20180A;background:var(--gold);border-color:transparent}
.seat .act.call{color:#DCE9FF;border-color:var(--info)}
.seat .act.check{color:var(--ink-2)}
.seat .act.blind{color:#EBD9A0;border-color:rgba(201,162,39,.5)}
.seat .act.allin{color:#fff;background:var(--bad);border-color:transparent}
.seat .bet{position:absolute;left:50%;transform:translateX(-50%);bottom:-46px;font-size:11.5px;font-weight:800;color:#F3D77A;z-index:3;
  background:rgba(8,14,12,.9);border:1px solid rgba(235,217,160,.35);border-radius:999px;padding:2px 8px 2px 6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.dbtn{position:absolute;top:-6px;right:6px;width:19px;height:19px;border-radius:50%;background:var(--card);
  color:#171A19;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.4)}

/* 내 자리 */
/* 내 자리: 카드 | 이름·칩·족보 | 상태. 높이를 고정해 상황이 바뀌어도 화면이 움직이지 않는다 */
.hero{display:grid;grid-template-columns:auto max-content;align-items:center;gap:14px;height:92px;box-sizing:border-box;padding:8px 6px;width:100%;max-width:560px;margin:0 auto;justify-content:center;grid-auto-columns:max-content}
/* 상태 문구는 테이블 중앙 팟 아래 (두 줄 고정) */
.center .msg{margin-top:8px;padding:0;min-height:0;height:2.7em;font-size:12.5px;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.center .msg .pill{font-size:13px;padding:3px 12px;white-space:nowrap;line-height:1.35}
.hero .cards{display:flex;gap:7px}
.hero .info{text-align:left;min-width:0}
.hero .nm{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .ch{font-size:20px;font-weight:800;color:var(--gold);line-height:1.1}
.hero .made{font-size:12px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.awaymenu{display:flex;flex-direction:column;gap:8px}
.awaymenu .opt[hidden]{display:none}
header .tbtn{white-space:nowrap}
.hstat span{white-space:nowrap}
.awaymenu .opt{text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.awaymenu .opt b{font-size:14px}.awaymenu .opt span{font-size:11.5px;color:var(--ink-2);font-weight:500}
.tbtn.away{border-color:var(--gold);color:var(--gold)}
.hero .made b{color:var(--ink)}
.hero.turn .info{position:relative}
.hero.turn .nm::after{content:"내 차례";margin-left:8px;font-size:10.5px;color:var(--gold);border:1px solid var(--gold);padding:1px 7px;border-radius:999px;vertical-align:2px}

/* 액션바 */
.actions{display:flex;gap:9px;align-items:center;justify-content:flex-start;padding:4px 0 6px;flex-wrap:wrap;height:100px;box-sizing:border-box;overflow:hidden}
.abtn{min-width:96px;padding:12px 18px;border-radius:11px;font-size:14.5px;font-weight:750;border:1px solid var(--line-2);background:var(--panel-2);transition:transform .08s}
.abtn:active{transform:scale(.98)}
.abtn:disabled{opacity:.32;cursor:default}
.abtn.fold{color:#D9908A}
.abtn.call{background:var(--info);border-color:transparent;color:#fff}
.abtn.raise{background:var(--gold);border-color:transparent;color:#20180A}
.abtn.allin{border-color:var(--bad);color:#E8938B}
.raisebox{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 12px}
.raisebox input[type=range]{width:150px;accent-color:var(--gold)}
.raisebox .amt{font-size:14px;font-weight:800;color:var(--gold);min-width:64px;text-align:right}
.msg{text-align:center;font-size:13px;color:var(--ink-2);padding:12px 0 8px;min-height:38px;line-height:1.4}
.msg .pill{display:inline-block;padding:4px 14px;border-radius:999px;border:1px solid rgba(201,162,39,.5);background:rgba(201,162,39,.12);color:#EBD9A0;font-size:13.5px}
.msg .pill.hot{border-color:rgba(222,106,96,.7);background:rgba(192,72,60,.16);color:#F0A29A;animation:pillblink .5s steps(2) infinite}
@keyframes pillblink{to{opacity:.55}}
.msg b{color:var(--gold)}

/* ── 사이드바 ── */
.sec{margin-bottom:14px}
.sec h2{margin:0 0 8px;font-size:12px;font-weight:750;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.sec h2 .r{margin-left:auto;font-size:11px;color:var(--mute);font-weight:600}
.box{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}

/* 어드바이저 */
.adv-off{color:var(--mute);font-size:12.5px;text-align:center;padding:14px 8px}
.advrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0}
.advrow+.advrow{border-top:1px solid var(--line)}
.advrow .k{font-size:12px;color:var(--ink-2)}
.advrow .v{font-size:13.5px;font-weight:750;text-align:right}
.advrow .v small{font-size:11px;color:var(--ink-2);font-weight:600;margin-left:3px}
.meter{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3E9E6E,#7FD3A6)}
.verdict{margin-top:10px;padding:9px 11px;border-radius:9px;font-size:12.5px;font-weight:700;line-height:1.5}
.verdict.go{background:rgba(62,158,110,.15);color:#7FD3A6}
.verdict.no{background:rgba(192,72,60,.15);color:#E29A92}
.verdict.mid{background:rgba(75,132,216,.14);color:#9FC0F0}
.advhand{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.advhand .lb{font-size:15px;font-weight:800}
.advhand .nk{font-size:12px;color:var(--ink-2);font-weight:650}
.tier{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.tier.S{background:var(--gold);color:#20180A}
.tier.A{background:#3E9E6E;color:#04160D}
.tier.B{background:#4B84D8;color:#04101F}
.tier.C{background:#4A5654;color:#DCE3E1}
.tier.D{background:#8C382F;color:#FFE6E2}
.why{font-size:12px;line-height:1.65;color:var(--ink-2);margin:0 0 9px}
.why b{color:var(--ink);font-weight:700}
.why+.why{margin-top:-4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(192,72,60,.16);color:#E8A79F}
.tag.ok{background:rgba(62,158,110,.16);color:#8FD9B2}
.beatline{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.beatline b{color:#E8A79F}
.beatline .safe{color:#8FD9B2}
.outlook{margin-top:9px}
.olrow{display:grid;grid-template-columns:78px 1fr 42px;gap:7px;align-items:center;font-size:11.5px;padding:2px 0}
.olrow .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.olrow .bar i{display:block;height:100%;background:var(--gold);opacity:.85}
.olrow .p{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* 족보표 */
.rank{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:8px}
.rank+.rank{margin-top:1px}
.rank .no{font-size:10.5px;color:var(--mute);width:15px;font-weight:700;text-align:center}
.rank .nm{font-size:12.5px;font-weight:700;width:96px;flex:0 0 auto}
.rank .ex{display:flex;gap:2px}
.rank.hit{background:var(--gold-soft);box-shadow:inset 0 0 0 1px rgba(201,162,39,.4)}
.rank.hit .nm{color:var(--gold)}

/* 로그 */
.log{max-height:190px;overflow-y:auto;font-size:12px;line-height:1.65}
.log div{padding:1px 0;color:var(--ink-2)}
.log .hd{color:var(--gold);font-weight:700;margin-top:5px}
.log .win{color:#7FD3A6;font-weight:650}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(5,8,7,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:22px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 4px;font-size:18px;font-weight:800}
.modal.small{max-width:380px;padding:16px}
.pophead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pophead h2{margin:0;flex:1;font-size:17px}
.pophead h2 .r{font-size:11px;color:var(--mute);font-weight:600;margin-left:6px}
.modal p.sub{margin:0 0 18px;font-size:12.5px;color:var(--ink-2)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:7px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{padding:8px 14px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2)}
.opt.on{background:var(--gold);color:#20180A;border-color:transparent}
.opt small{display:block;font-size:10.5px;font-weight:600;opacity:.75;margin-top:1px}
.start{width:100%;padding:14px;border-radius:12px;background:var(--gold);color:#20180A;font-size:15px;font-weight:800;margin-top:4px}
.hint{font-size:11.5px;color:var(--mute);margin-top:8px;line-height:1.6}
.numin{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  color:var(--ink);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;outline:none;margin-top:7px;font-family:inherit}
.numin:focus{border-color:var(--gold)}
.warn{font-size:11.5px;color:#E29A92;margin-top:6px}

/* ── 모바일 탭바 (폰에서만 노출) ── */
.mtabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(15,20,21,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0)}
.mtabs button{flex:1;min-height:50px;font-size:12px;font-weight:700;color:var(--mute)}
.mtabs button.on{color:var(--gold)}

/* ── 모바일: 스크롤 없이 한 화면에 정확히 맞춘다 ── */
@media (max-width:1080px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .app{height:100dvh;height:100svh}
  main{grid-template-columns:1fr;min-height:0}
  /* 상태바(시계·배터리) 영역 확보 */
  header{padding:calc(7px + env(safe-area-inset-top,0)) 12px 7px;gap:8px}
  header h1{font-size:14px}
  .hstat{gap:10px;font-size:11.5px}
  .hstat span:nth-child(2){display:none}
  .hstat span:first-child{display:none}
  .hstat{margin-left:auto;gap:6px}
  header .tbtn{padding:6px 8px;font-size:11.5px}
  .tbtn{padding:6px 10px;font-size:11.5px}
  /* 테이블이 남는 공간을 전부 차지하고, 그 아래 요소는 고정 높이 */
  .stage{display:flex;flex-direction:column;min-height:0;
    padding:8px 10px calc(6px + env(safe-area-inset-bottom,0))}
  .tablewrap{flex:1 1 auto;min-height:0}
  .felt{width:100%;height:100%;max-width:none;aspect-ratio:auto;border-radius:50%;border-width:9px}
  .hero,.msg,.actions{flex:0 0 auto}
  /* 폰에서는 사이드바 없음: 족보·어드바이저는 헤더 버튼 팝업, 채팅은 테이블 아래 독 */
  aside{display:none}
}

  .seat .nm .sty{font-size:10px;color:var(--gold);font-weight:600;margin-left:3px}
.seat .nm{font-size:10px}.seat .ch{font-size:10.5px}
  .seat .act{font-size:9.5px;padding:1px 6px;bottom:-17px}
  .seat .bet{font-size:10px;bottom:-36px;padding:1px 6px 1px 5px}
  .dbtn{width:15px;height:15px;font-size:8.5px;top:-4px;right:2px}
  .hero{gap:10px;padding:6px 4px;height:74px;grid-template-columns:auto minmax(0,1fr)}

  .hero .nm{font-size:12px}

  /* 안내문·액션 영역은 내용이 비어도 높이를 유지한다. 안 그러면 상대 턴마다 테이블이 커졌다 작아진다 */
  .msg{font-size:12px;padding:3px 0;min-height:20px;max-height:38px;overflow:hidden}
  /* 액션: 슬라이더 1줄 + 버튼 1줄, 총 2줄 높이를 항상 확보 */

  .raisebox input[type=range]{flex:1;width:auto}
  .raisebox .amt{font-size:13px;min-width:56px}

  .rcard .card.sm{width:19px;height:27px;border-radius:3px}
  .rcard .card.sm .rk{font-size:8px}.rcard .card.sm .st{font-size:7.5px}
}

<body>
<div class="app">
  <header>
    <h1>육지덤</h1>
    <div class="hstat">
      <span>핸드 <b class="num" id="hHand">0</b></span>
      <span>블라인드 <b class="num" id="hBlind">50 / 100</b></span>
      <span>난이도 <b id="hDiff">중수</b></span>
    </div>
    <button class="tbtn" id="btnAway" hidden>자리 비움</button>
    <button class="tbtn" id="btnRanks">족보</button>
    <button class="tbtn" id="btnAdv">어드바이저 ON</button>
    <button class="tbtn" id="btnSet">설정</button>
  </header>

  <main>
    <section class="stage">
      <div class="tablewrap">
        <div class="felt" id="felt">
          <div class="center">
            <div class="board" id="board"></div>
            <div class="potrow"><span class="potline">팟</span><span class="pot num" id="pot">0</span><span class="stagetag" id="stageTag"></span></div>
            <div class="msg" id="msg"></div>
          </div>
          <div class="ann" id="ann"></div>
          <div class="result" id="result"></div>
        </div>
      </div>

      <div class="hero" id="hero">
        <div class="cards" id="heroCards"></div>
        <div class="info">
          <div class="nm" id="heroName">나</div>
          <div class="ch num" id="heroStack">0</div>
          <div class="made" id="heroMade"></div>
        </div>
      </div>
      <div class="actions" id="actions"></div>
      <div class="chatdock" id="chatdock" hidden>
        <div class="cdlines" id="cdLines"></div>
        <div class="cdemotes" id="cdEmotes"></div>
        <div class="cdrow"><input class="numin" id="cdInput" type="text" maxlength="80" placeholder="채팅 (이모지는 위에서 바로)" autocomplete="off"><button class="opt small" id="cdSend">보내기</button></div>
      </div>
    </section>

    <aside id="side">
      <div class="sec" data-sec="adv">
        <h2>어드바이저 <span class="r" id="advState">ON</span></h2>
        <div class="box" id="advBox"></div>
      </div>
      <div class="sec" data-sec="ranks">
        <h2>족보 <span class="r">위가 강함</span></h2>
        <div class="box" id="ranks"></div>
      </div>
      <div class="sec" data-sec="chat">
        <h2>채팅 <span class="r" id="chatState">온라인에서 사용</span></h2>
        <div class="box chat" id="chat"></div>
        <div class="emotes" id="emotes"></div>
        <div class="chatrow"><input class="numin" id="inChat" type="text" maxlength="80" placeholder="메시지"><button class="opt small" id="btnChat">보내기</button></div>
      </div>
      <div class="sec" data-sec="log">
        <h2>진행 기록</h2>
        <div class="box log" id="log"></div>
      </div>
    </aside>
  </main>

</div>

<!-- 족보 팝업 (헤더 버튼) -->
<div class="ov" id="ovRanks">
  <div class="modal small">
    <div class="pophead"><h2>족보 <span class="r">위가 강함</span></h2><button class="opt small" id="closeRanks">닫기</button></div>
    <div class="box" id="ranksPop"></div>
  </div>
</div>
<!-- 자리 비움 팝업 (온라인, 헤더 버튼) -->
<div class="ov" id="ovAway">
  <div class="modal small">
    <div class="pophead"><h2>자리 비움</h2><button class="opt small" id="closeAway">닫기</button></div>
    <div class="awaymenu">
      <button class="opt" id="awayFold"><b>자리 비움</b><span>다음 핸드부터 카드를 받지 않는다. 내 차례가 오면 자동 체크/폴드</span></button>
      <button class="opt" id="awayBot"><b>AI에게 맡기기</b><span>방 난이도의 봇이 내 패로 대신 친다</span></button>
      <button class="opt" id="awayBack"><b>돌아오기</b><span>다음 핸드부터 다시 참여</span></button>
    </div>
  </div>
</div>
<!-- 어드바이저 팝업 (폰에서 헤더 버튼) -->
<div class="ov" id="ovAdv">
  <div class="modal small">
    <div class="pophead"><h2>어드바이저</h2><button class="opt small" id="toggleAdv">끄기</button><button class="opt small" id="closeAdv">닫기</button></div>
    <div class="box" id="advPop"></div>
  </div>
</div>

<div class="ov on" id="ov">
  <div class="modal">
    <h2>게임 설정</h2>
    <div class="mtab"><button class="on" data-mode="local" id="tabLocal">혼자 연습</button><button data-mode="net" id="tabNet">친구와 온라인</button></div>
    <p class="sub localonly">설정을 바꾸면 새 게임으로 시작합니다.</p>
    <p class="sub netonly">방을 만들고 코드나 링크를 친구에게 보내세요. 서로 다른 곳에서도 됩니다.</p>
    <div class="netonly" id="netPanel">
      <div id="netJoinBox">
        <div class="fld"><label>내 이름</label><input class="numin" id="inName" type="text" maxlength="12" placeholder="친구에게 보일 이름"></div>
        <div class="fld" id="serverFld"><label>서버 주소</label><input class="numin" id="inServer" type="text" placeholder="https://…onrender.com"></div>
        <div class="netrow">
          <button class="start half" id="btnCreate">새 방 만들기</button>
          <div class="joinbox"><input class="numin code" id="inCode" type="text" maxlength="4" placeholder="방 코드" inputmode="numeric" pattern="[0-9]*"><button class="start half" id="btnJoin">참가</button></div>
        </div>
      </div>
      <div id="lobby" style="display:none"></div>
      <p class="hint" id="netStatus"></p>
    </div>
    <div class="fld localonly">
      <label>상대 수</label>
      <div class="opts" id="optOpp"></div>
    </div>
    <h3 class="netcfg cfghead">방 설정 <span>방장만 바꿀 수 있습니다</span></h3>
    <div class="fld netcfg">
      <label>난이도</label>
      <div class="opts" id="optDiff"></div>
    </div>
    <div class="fld localonly">
      <label>어드바이저</label>
      <div class="opts" id="optAdv"></div>
    </div>
    <div class="fld netcfg">
      <label>진행 속도</label>
      <div class="opts" id="optSpeed"></div>
    </div>
    <div class="fld netonly netcfg">
      <label>차례 제한 시간</label>
      <div class="opts" id="optTurn"></div>
      <p class="hint">시간이 지나면 자동으로 체크 또는 폴드됩니다. 게임이 늘어지지 않게 합니다.</p>
    </div>
    <div class="fld netcfg">
      <label>시작 칩</label>
      <div class="opts" id="optStack"></div>
      <input class="numin num" id="inStack" type="number" min="100" step="1000" inputmode="numeric">
    </div>
    <div class="fld netcfg">
      <label>최소 베팅 (빅블라인드)</label>
      <div class="opts" id="optBB"></div>
      <input class="numin num" id="inBB" type="number" min="2" step="10" inputmode="numeric">
      <p class="hint" id="bbHint"></p>
    </div>
    <div class="netonly" id="netStartBox"></div>
    <button class="start localonly" id="btnStart">게임 시작</button>
    <p class="hint localonly">어드바이저는 승률·아웃츠·팟오즈를 계산해 콜 가치를 알려줍니다. 규칙에 익숙해지면 끄고 연습하세요.</p>
  </div>
</div>

<script src="engine.js"></script>
<script src="table.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
const SUIT = HE.SUIT_CH;
const RED = (s) => s === 1 || s === 2;

/* ───────── 상태 ───────── */
const CFG = { opp: 3, diff: 'normal', advisor: true, stack: 10000, bb: 100, speed: 'slow', turn: 10 };
// 진행 속도. 초보자가 흐름을 따라갈 수 있도록 기본은 '느리게'.
const SPEEDS = {
  slow: { ai: 1500, stage: 1400, ann: 1500, reveal: 1 },
  normal: { ai: 800, stage: 800, ann: 900, reveal: 0.7 },
  fast: { ai: 360, stage: 420, ann: 520, reveal: 0.45 },
  folded: { ai: 260, stage: 300, ann: 400, reveal: 0.7 },  // 내가 폴드한 판은 빠르게 넘긴다
};
const SP = () => {
  const me = G.players[0];
  if (me && me.folded && G.stage !== 'showdown') return SPEEDS.folded;
  return SPEEDS[CFG.speed] || SPEEDS.slow;
};
// 최소 베팅 = 빅블라인드. 스몰블라인드는 그 절반(홀수면 내림, 최소 1).
const SB = () => Math.max(1, Math.floor(CFG.bb / 2));
const STEP = () => Math.max(1, Math.floor(CFG.bb / 2));
const DIFF_NAME = { easy: '하수', normal: '중수', hard: '고수', pro: '프로', mix: '섞기' };

/*
 * 게임 진행은 table.js(TB.Table)가 맡는다. 화면은 G를 읽어 그린다.
 *   혼자 연습: G = 브라우저 안의 Table 인스턴스(T) 그 자체
 *   온라인   : G = 서버가 보내주는 내 좌석 기준 화면 상태(view). 덱·남의 패는 없다.
 */
const MODE = { net: false };
const T = new TB.Table(CFG, onTableEvent);
let G = T;
let RES = null;               // 마지막 핸드 결과(오버레이용)
// 쇼다운 연출: 남은 보드를 한 장씩, 패는 약한 순서로 한 명씩 공개하고 승자를 마지막에 보여준다
const REVEAL = { on: false, board: 5, seats: null, hand: 0, timers: [] };
const PRE = { board: 0 };     // 쇼다운 직전까지 깔려 있던 보드 수
function revealClear() { REVEAL.timers.forEach(clearTimeout); REVEAL.timers = []; REVEAL.on = false; const f = $('felt'); if (f && f.classList) f.classList.remove('drama', 'drum'); }
function onShowdown(res) {
  if (!res) return;
  if (REVEAL.hand === G.handNo) return;          // 같은 핸드에서 두 번 돌리지 않는다
  REVEAL.hand = G.handNo;
  const rows = res.rows || [];
  if (rows.length < 2) { render(); showResult(res); showNextButton(); return; }
  const n = G.players.length;
  const toView = (seat) => (G.seat == null ? seat : (seat - G.seat + n) % n);
  const order = rows.slice().sort((a, b) => a.score - b.score).map((r) => toView(r.seat)).filter((v) => v !== 0);   // 내 패는 이미 보임
  const missing = Math.max(0, Math.min(5, G.board.length) - PRE.board);
  // 올인 쇼다운(남은 보드가 있을 때): 천천히, 조명 낮추고, 마지막 카드 전에 두구두구
  const drama = missing > 0 && G.players.some((p) => p.allIn && !p.folded && !p.out);
  const k = (SPEEDS[CFG.speed] || SPEEDS.slow).reveal * (drama ? 1.7 : 1);
  revealClear();
  REVEAL.on = true; REVEAL.board = PRE.board; REVEAL.seats = new Set();
  $('result').classList.remove('on');
  let t = 250;
  const at = (ms, fn) => REVEAL.timers.push(setTimeout(fn, ms));
  render();
  if (drama) { $('felt').classList.add('drama'); announce('<span class="who">올인</span>쇼다운', 'drama', 1300); t += 1300; }
  for (let i = 0; i < missing; i++) {
    const last = drama && i === missing - 1;
    if (last) { t += 500 * k; at(t, () => { $('felt').classList.add('drum'); announce('두구두구', 'drum', 1400 * k); }); t += 1400 * k; }
    else t += 900 * k;
    at(t, () => { $('felt').classList.remove('drum'); REVEAL.board++; const c = G.board[REVEAL.board - 1]; announce((REVEAL.board === 4 ? '턴' : REVEAL.board === 5 ? '리버' : '플랍') + annCard(c), 'stage'); render(); });
  }
  order.forEach((v, i) => {
    t += (i === order.length - 1 ? 1000 : 700) * k;
    at(t, () => {
      REVEAL.seats.add(v);
      const row = rows.find((r) => toView(r.seat) === v);
      if (row) announce('<span class="who">' + esc(row.name) + '</span>' + row.hand, row.win ? 'raise' : 'check');
      render();
    });
  });
  t += 700 * k;
  at(t, () => { REVEAL.on = false; $('felt').classList.remove('drama', 'drum'); render(); showResult(res); showNextButton(); });
}

function onTableEvent(type, data) {
  if (type === 'action') announceAction(data);
  else if (type === 'stage') announceStage(data);
  else if (type === 'result') RES = data;
}

/* ───────── 카드 렌더 ───────── */
function cardEl(c, cls) {
  const d = document.createElement('div');
  d.className = 'card ' + (cls || '');
  if (!c) { d.className += ' back'; return d; }
  if (RED(c.s)) d.classList.add('red');
  d.innerHTML = '<span class="rk">' + HE.rankName(c.r) + '</span><span class="st">' + SUIT[c.s] + '</span>';
  return d;
}
function ph() { const d = document.createElement('div'); d.className = 'card ph'; return d; }

/* ───────── 혼자 연습: 게임 시작·진행 ───────── */
function newGame() {
  MODE.net = false; G = T; RES = null; REVEAL.hand = 0;
  T.reset();
  T.addPlayer({ id: 0, name: '나', human: true, stack: CFG.stack });
  T.addBots(CFG.opp);
  $('hBlind').textContent = fmt(SB()) + ' / ' + fmt(CFG.bb);
  $('hDiff').textContent = DIFF_NAME[CFG.diff];
  renderRanks();
  $('result').classList.remove('on');
  render();                       // 테이블만 깔고, 시작 버튼을 누르면 첫 핸드가 돈다
}

function alivePlayers() { return G.players.filter((p) => !p.out); }
const inHand = () => G.players.filter((p) => !p.out && !p.folded);
const canAct = () => G.players.filter((p) => !p.out && !p.folded && !p.allIn);
const potTotal = () => G.players.reduce((a, p) => a + p.committed, 0);

function startHand() {
  if (MODE.net) return;
  T.players.forEach((p) => { if (p.stack <= 0) p.out = true; });
  if (T.players[0].out || T.alive().length < 2) return gameOver();
  $('result').classList.remove('on');
  RES = null; revealClear();
  T.startHand();
  drive();
}

/** 내 액션 (혼자 연습이면 테이블에 직접, 온라인이면 서버로) */
function doAction(i, type, amount) {
  if (MODE.net) { netSend({ t: 'act', type, amount }); return; }
  T.doAction(i, type, amount);
  drive();
}
function endHand() { if (MODE.net) return; T.endHand(); drive(); }

/** 상태가 바뀔 때마다 호출. 다음에 할 일을 보고 타이머를 건다. */
let driveT = null;
function drive() {
  clearTimeout(driveT);
  const p = T.pending();
  render();
  if (p === 'bot') { G.busy = true; driveT = setTimeout(() => { T.next(); drive(); }, SP().ai); }
  else if (p === 'stage') { G.busy = true; driveT = setTimeout(() => { T.next(); drive(); }, SP().stage); }
  else if (p === 'showdown') { G.busy = false; onShowdown(RES || T.result); }
  else if (p === 'over') { G.busy = false; gameOver(); }
  else G.busy = false;
}

/** 테이블 위에 최근 액션을 크게 띄운다 */
let annT = null;
function announce(html, cls, ms) {
  const el = $('ann');
  if (!el) return;
  el.innerHTML = html;
  el.className = 'ann on ' + (cls || '');
  clearTimeout(annT);
  annT = setTimeout(() => { el.className = 'ann ' + (cls || ''); }, ms || SP().ann);
}
const annCard = (c) => '<span class="anncard' + (RED(c.s) ? ' red' : '') + '"><span class="rk">' + HE.rankName(c.r) + '</span><span class="st">' + SUIT[c.s] + '</span></span>';
function announceAction(d) { announce('<span class="who">' + esc(d.name) + '</span>' + d.act, d.cls); }
function announceStage(d) {
  const label = { flop: '플랍', turn: '턴', river: '리버' }[d.stage] || d.stage;
  announce(label + d.cards.map(annCard).join(''), 'stage');
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ───────── 핸드 종료 연출 ───────── */
/** WIN / LOSE 와 승리 족보를 테이블 위에 띄운다 */
function showResult(res) {
  if (!res) return;
  const me = G.players[0];
  const delta = me.stack - (me.handStart == null ? me.stack : me.handStart);
  const iWon = res.iWon != null ? res.iWon : (res.winnerSeats || []).indexOf(0) >= 0;
  const myName = me.name;
  // 폴드는 승패가 아니라 '기권'이다. 손익 0이어도 DRAW(팟 분배)와 구분해서 표기한다.
  const kind = me.folded ? 'fold' : delta > 0 ? 'win' : delta < 0 ? 'lose' : 'draw';
  const label = me.folded ? 'FOLD' : delta > 0 ? 'WIN' : delta < 0 ? 'LOSE' : 'DRAW';
  const others = res.winners.filter((w) => w !== myName);

  let who = '';
  if (iWon && res.winners.length === 1) who = res.allFolded ? '상대가 모두 폴드했습니다' : '내 <b>' + res.hand + '</b> 승리';
  else if (iWon) who = '분할 승리 · <b>' + res.hand + '</b>';
  else if (res.allFolded) who = '<b>' + esc(others.join(', ')) + '</b> 승리 (모두 폴드)';
  else who = '<b>' + esc(others.join(', ')) + '</b> 승리 · ' + res.hand;

  const mini = (c) => '<span class="card sm' + (RED(c.s) ? ' red' : '') + '"><span class="rk">' +
    HE.rankName(c.r) + '</span><span class="st">' + SUIT[c.s] + '</span></span>';

  let body = '';
  if (res.rows && res.rows.length) {
    // 쇼다운: 승자와 내 패를 나란히 비교 (누가 무엇으로 이겼는지)
    const rows = res.rows.map((r) => Object.assign({}, r, { isMe: r.isMe != null ? r.isMe : r.seat === 0 }));
    const winRows = rows.filter((r) => r.win);
    const myRow = rows.find((r) => r.isMe);
    const show = winRows.slice(0, 3);
    if (myRow && !myRow.win) show.push(myRow);
    body = '<div class="rshow">' + show.map((r) =>
      '<div class="rrow' + (r.win ? ' w' : '') + '">' +
      '<span class="rn">' + (r.isMe ? '나' : esc(r.name)) + '</span>' +
      '<span class="rh">' + r.hand + '</span>' +
      '<span class="rc"><span class="rhole">' + r.hole.map(mini).join('') + '</span>' +
      r.cards.map(mini).join('') + '</span></div>').join('') + '</div>';
    if (myRow && !myRow.win) {
      body += '<div class="rsub" style="margin-top:8px">' + (winRows[0] ? esc(winRows[0].name) + '의 <b style="color:#EBD9A0">' + winRows[0].hand + '</b>에 밀렸습니다' : '') + '</div>';
    }
  } else if (res.cards && res.cards.length) {
    body = '<div class="rcards">' + res.cards.map(mini).join('') + '</div>';
  } else if (me.folded && !iWon) {
    body = '<div class="rsub">' + (delta === 0 ? '칩을 걸기 전에 폴드해 손실이 없습니다' : '폴드로 이번 핸드를 넘겼습니다') + '</div>';
  }

  // 승자 자리 표시(후광) + 팟에서 칩이 날아가는 연출
  const n = G.players.length;
  const toV = (seat) => (G.seat == null ? seat : (seat - G.seat + n) % n);
  FX.winners = new Set((res.winnerSeats || []).map(toV)); FX.winHand = G.handNo;
  render();
  flyChips(Array.from(FX.winners));
  // 온라인에서 칩이 0이 되면: 파산했다는 것과 얼마로 다시 시작하는지 결과 카드에서 바로 알려준다
  const bust = MODE.net && me.stack <= 0 && !iWon
    ? '<div class="rbust"><div class="rbtitle">파산</div><div class="rbsub">칩을 모두 잃었습니다. 다음 핸드에 <b>시작 칩의 ' + rebuyPct(me) + '%</b> = <b>' + fmt(rebuyAmt(me)) + '</b>으로 다시 시작합니다' + ((me.rebuys || 0) > 0 ? ' <span class="rbn">' + ((me.rebuys || 0) + 1) + '번째 부활</span>' : '') + '</div></div>'
    : '';
  $('result').innerHTML = (kind === 'win' ? confettiHtml() : '') +
    '<div class="rcard ' + kind + (bust ? ' bust' : '') + '">' +
    '<div class="rlabel ' + kind + '">' + label + '</div>' +
    '<div class="rdelta ' + kind + '">' + (delta > 0 ? '+' : '') + fmt(delta) + '</div>' +
    '<div class="rwho">' + who + '</div>' + body + bust + '</div>';
  $('result').classList.add('on');
}

/** 테이블이 깔린 뒤 첫 핸드는 시작 버튼을 눌러야 돈다 (온라인은 방장만) */

/* ───────── 온라인 ───────── */
/*
 * 서버(server.js)가 덱과 진행을 쥔다. 브라우저는 자기 좌석 기준 화면 상태(view)를 받아 그리고,
 * 액션만 보낸다. 방 코드로 입장하며, 토큰을 저장해 두어 새로고침해도 자리를 잃지 않는다.
 */
const NET = { ws: null, url: '', code: '', seat: -1, host: false, token: '', name: '', lobby: null, retry: null, wantClose: false, seated: false };
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
function defaultServer() {
  if (location.protocol === 'http:' || location.protocol === 'https:') return location.origin;
  return store.get('ht.server') || '';
}
function wsUrl(base) {
  const u = base.replace(/\/+$/, '');
  if (/^wss?:/.test(u)) return u;
  return u.replace(/^http/, 'ws');
}
function netSend(m) { if (NET.ws && NET.ws.readyState === 1) NET.ws.send(JSON.stringify(m)); }

function netConnect(base, onOpen) {
  NET.wantClose = false;
  if (NET.ws) { try { NET.ws.onclose = null; NET.ws.close(); } catch (e) {} }
  let ws;
  try { ws = new WebSocket(wsUrl(base)); } catch (e) { netStatus('서버 주소가 올바르지 않습니다.', true); return; }
  NET.ws = ws; NET.url = base;
  netStatus('서버에 연결하는 중… (무료 서버는 처음 깨우는 데 30초쯤 걸릴 수 있습니다)');
  ws.onopen = () => { netStatus('연결됨'); clearTimeout(NET.pongT); if (onOpen) onOpen(); };
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } try { netHandle(m); } catch (err) { console.error(err); netStatus('화면 오류: ' + (err && err.message ? err.message : err) + ' (' + m.t + ')', true); } };
  ws.onerror = () => { netStatus('연결에 실패했습니다. 서버 주소를 확인하세요.', true); };
  ws.onclose = () => {
    if (NET.wantClose) return;
    netStatus('연결이 끊겼습니다. 다시 연결하는 중…', true);
    if (NET.code && $('msg')) $('msg').innerHTML = '<b>연결 끊김</b><br>다시 연결하는 중…';
    netReconnectSoon(2000);
  };
}
/** 잠시 뒤 같은 방으로 다시 들어간다 (끊김·백그라운드 복귀) */
function netReconnectSoon(ms) {
  clearTimeout(NET.retry);
  NET.retry = setTimeout(() => { if (NET.code) netConnect(NET.url, () => netSend({ t: 'join', code: NET.code, name: NET.name, token: NET.token })); }, ms);
}
/**
 * 폰이 백그라운드에 있다가 돌아오면 소켓이 조용히 죽어 있는 경우가 많다(onclose가 늦게 오거나 안 온다).
 * 핑을 보내 3초 안에 답이 없으면 즉시 다시 연결한다.
 */
function netCheckAlive() {
  if (!NET.code || NET.wantClose) return;
  if (!NET.ws || NET.ws.readyState !== 1) { netReconnectSoon(100); return; }
  netSend({ t: 'ping' });
  clearTimeout(NET.pongT);
  NET.pongT = setTimeout(() => { try { NET.ws.onclose = null; NET.ws.close(); } catch (e) {} netReconnectSoon(100); }, 3000);
}
let hideT = null;
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      clearTimeout(hideT); netCheckAlive();
      if (NET.autoAway) { NET.autoAway = false; netSend({ t: 'away', mode: '' }); }   // 화면으로 돌아오면 자동 복귀
    } else if (MODE.net && NET.code && G.players[0] && !G.players[0].away) {
      // 화면을 떠나면(다른 앱·화면 잠금) 잠시 뒤 자리 비움으로. 접속이 끊겨도 서버가 같은 처리를 한다
      clearTimeout(hideT);
      hideT = setTimeout(() => { if (document.visibilityState !== 'visible') { NET.autoAway = true; netSend({ t: 'away', mode: 'fold', auto: 1 }); } }, 3000);
    }
  });
  if (typeof window !== 'undefined' && window.addEventListener) { window.addEventListener('online', () => netCheckAlive()); window.addEventListener('pageshow', () => netCheckAlive()); }
}
function netLeave() {
  NET.wantClose = true; clearTimeout(NET.retry);
  netSend({ t: 'leave' });
  if (NET.ws) { try { NET.ws.close(); } catch (e) {} }
  NET.ws = null; NET.code = ''; NET.seat = -1; NET.host = false; NET.lobby = null; NET.seated = false;
  store.set('ht.room', ''); store.set('ht.token', '');
  MODE.net = false; G = T;
  $('chatdock').hidden = true; $('btnAdv').style.display = ''; document.title = '육지덤';
  document.querySelectorAll('#mtabs button[data-sec="adv"], #side .sec[data-sec="adv"]').forEach((b) => { b.style.display = ''; });
  renderLobby();
}

function netHandle(m) {
  if (m.t === 'joined') {
    NET.code = m.code; NET.seat = m.seat; NET.token = m.token; NET.host = !!m.host;
    store.set('ht.room', m.code); store.set('ht.token', m.token); store.set('ht.server', NET.url);
    netStatus('');
    if ($('chatState')) $('chatState').textContent = '방 ' + m.code;
    $('chatdock').hidden = false;
    renderLobby();
  } else if (m.t === 'lobby') {
    NET.lobby = m; NET.host = !!m.host;
    renderLobby();
  } else if (m.t === 'state') {
    MODE.net = true; G = m.view; NET.seated = true;
    if (m.view.cfg) { CFG.bb = m.view.cfg.bb; CFG.stack = m.view.cfg.stack; CFG.diff = m.view.cfg.diff || CFG.diff; if (m.view.cfg.speed) CFG.speed = m.view.cfg.speed; }
    if (m.view.result) RES = m.view.result;
    $('ov').classList.remove('on');
    $('hBlind').textContent = fmt(SB()) + ' / ' + fmt(CFG.bb);
    $('hDiff').textContent = '방 ' + NET.code + ' · ' + (DIFF_NAME[CFG.diff] || '');
    document.querySelectorAll('#mtabs button[data-sec="adv"]').forEach((b) => { b.style.display = 'none'; });
    document.querySelectorAll('#side .sec[data-sec="adv"]').forEach((b) => { b.style.display = 'none'; });
    $('btnAdv').style.display = 'none';
    $('chatdock').hidden = false;
    myTurnAlert();
    if (G.stage !== 'showdown') { $('result').classList.remove('on'); revealClear(); REVEAL.hand = 0; }   // 재시작으로 핸드 번호가 1부터 다시 시작해도 쇼다운 연출이 나오게
    if (G.stage === 'showdown') { if (REVEAL.hand !== G.handNo) onShowdown(RES); else if (!REVEAL.on) { render(); showResult(RES); showNextButton(); } }
    else render();
  } else if (m.t === 'event') {
    if (m.name === 'action') announceAction(m.data);
    else if (m.name === 'stage') announceStage(m.data);
    else if (m.name === 'hand') { RES = null; $('result').classList.remove('on'); }
    else if (m.name === 'rebuy') onRebuy(m.data);
    else if (m.name === 'bust') { chatPush('알림', m.data.name + ' 파산으로 테이블을 떠났습니다', false); }
  } else if (m.t === 'paused') {
    $('msg').innerHTML = '<b>잠시 멈춤</b><br>' + esc((m.names || []).join(', ')) + ' 자리 비움';
  } else if (m.t === 'countdown') {
    $('msg').textContent = m.sec > 0 ? '다음 핸드까지 ' + m.sec + '초' : '';
  } else if (m.t === 'turnclock') {
    if (G.toAct === 0) $('msg').innerHTML = '<span class="pill' + (m.sec <= 3 ? ' hot' : '') + '">내 차례 · ' + m.sec + '초</span>';
  } else if (m.t === 'gameover') {
    NET.lobby = m.lobby || NET.lobby;
    $('msg').innerHTML = '<b>게임 종료</b><br>' + esc(m.winner || '') + ' 승리';
    $('actions').innerHTML = '';
    setTimeout(() => { $('ov').classList.add('on'); renderLobby(); }, 2500);
  } else if (m.t === 'chat') {
    chatPush(m.name, m.text, m.name === NET.name);
  } else if (m.t === 'pong') {
    clearTimeout(NET.pongT); netStatus('연결됨');
  } else if (m.t === 'error') {
    if (NET.code && /찾을 수 없습니다/.test(m.msg)) {   // 게임 중 방이 사라짐(서버 재시작 등): 방을 정리하고 새로 만들 수 있게 안내
      const code = NET.code;
      NET.wantClose = true; clearTimeout(NET.retry);
      NET.code = ''; NET.seat = -1; NET.host = false; NET.lobby = null; NET.seated = false;
      store.set('ht.room', ''); store.set('ht.token', '');
      MODE.net = false; G = T;
      $('chatdock').hidden = true; document.title = '육지덤';
      $('msg').innerHTML = '<b>방 ' + esc(code) + ' 사라짐</b><br>설정에서 새로 만들기';
      $('actions').innerHTML = '';
      setModeTab('net'); renderLobby(); netStatus('방 ' + code + '이 사라졌습니다. 새로 만들거나 다른 코드로 참가하세요.', true);
      $('ov').classList.add('on');
      return;
    }
    if (NET.auto && !NET.code && /찾을 수 없습니다/.test(m.msg)) {   // 지난 방이 사라짐: 조용히 혼자 연습으로
      NET.auto = false; store.set('ht.room', ''); store.set('ht.token', '');
      NET.wantClose = true; if (NET.ws) { try { NET.ws.close(); } catch (e) {} }
      setModeTab('local'); netStatus('');
      return;
    }
    NET.auto = false;
    netStatus(m.msg, true);
  }
}
function netStatus(text, bad) {
  const el = $('netStatus');
  if (!el) return;
  el.textContent = text; el.className = 'hint' + (bad ? ' bad' : '');
}

/** 초대 링크·공유 (로비와 테이블에서 공용) */
function roomLink() { return (location.protocol.startsWith('http') ? location.origin + location.pathname : NET.url + '/') + '?room=' + NET.code; }
function copyLink(btn) {
  const link = roomLink();
  const done = () => { if (btn) { const t = btn.textContent; btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = t; }, 1500); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => prompt('링크', link));
  else prompt('링크', link);
}
function shareRoom() {
  // 공유 문구: 제목 줄 → 방 코드 → 링크 (링크를 text 안에 넣어야 앱마다 끝에 빈 줄이 붙지 않는다)
  const text = "육지덤 Let's go\n방 코드 " + NET.code + "\n" + roomLink();
  if (navigator.share) navigator.share({ title: '육지덤', text }).catch(() => {});
  else { copyLink(null); $('msg').textContent = '링크를 복사했습니다'; }
}

/** 설정창의 온라인 패널: 코드·공유하기 → 명단 → (방장) 방 설정 → 맨 아래 테이블로 */
function renderLobby() {
  const box = $('lobby'), startBox = $('netStartBox');
  if (!box) return;
  const inRoom = !!NET.code;
  $('ov').querySelector('.modal').classList.toggle('hostcfg', inRoom && NET.host);
  $('netJoinBox').style.display = inRoom ? 'none' : '';
  box.style.display = inRoom ? '' : 'none';
  startBox.innerHTML = '';
  if (!inRoom) return;
  const L = NET.lobby || { players: [] };
  let html = '<div class="lobbyhead"><span>방 코드 <b class="code">' + esc(NET.code) + '</b></span>' +
    '<span class="lobbybtns"><button class="opt small" id="btnShare">공유하기</button><button class="opt small" id="btnCopy">링크 복사</button></span></div>';
  html += '<div class="plist">' + (L.players || []).map((p, i) =>
    '<div class="prow' + (p.online === false ? ' off' : '') + '"><span class="pn">' + esc(p.name) + (p.host ? ' <em>방장</em>' : '') + (p.bot ? ' <em>봇</em>' : '') + (p.online === false ? ' <em>오프라인</em>' : '') + (p.away ? ' <em>' + (p.away === 'bot' ? 'AI 대리' : '자리 비움') + '</em>' : '') + '</span>' +
    (NET.host && (p.bot || i !== 0) && (!L.playing || p.online === false) ? '<button class="opt small" data-kick="' + i + '">내보내기</button>' : '') + '</div>').join('') + '</div>';
  html += '<div class="lobbyrow">' +
    (NET.host && !L.playing ? '<button class="opt small" id="btnBot">봇 추가</button>' : '') +
    '<button class="opt small" id="btnLeave">방 나가기</button>' +
    '<span class="lobbynote">' + (L.playing ? '게임 진행 중' : NET.host ? '설정을 마치고 테이블로 나가서 친구를 기다리세요'  : '방장이 시작하길 기다리는 중입니다') + '</span></div>';
  box.innerHTML = html;
  // 맨 아래 큰 버튼
  if (L.playing || NET.host) {
    const b = document.createElement('button');
    b.className = 'start';
    b.textContent = NET.host ? (L.playing && NET.seated && G.stage !== 'idle' ? '테이블로' : '테이블로 (설정 적용)') : '테이블로';
    b.onclick = () => {
      if (NET.host && (!L.playing || G.stage === 'idle' || G.stage === 'over')) {
        clampStake();
        netSend({ t: 'start', cfg: { stack: CFG.stack, bb: CFG.bb, diff: CFG.diff, speed: CFG.speed, turn: CFG.turn } });
        $('ov').classList.remove('on');
        return;
      }
      $('ov').classList.remove('on');
      if (!NET.seated) $('msg').innerHTML = '<b>대기 중</b><br>다음 핸드부터 참여';
    };
    startBox.appendChild(b);
  }
  $('btnShare').onclick = () => shareRoom();
  $('btnCopy').onclick = () => copyLink($('btnCopy'));
  if ($('btnBot')) $('btnBot').onclick = () => netSend({ t: 'addBot' });
  $('btnLeave').onclick = () => netLeave();
  box.querySelectorAll('[data-kick]').forEach((b) => { b.onclick = () => netSend({ t: 'kick', seat: +b.dataset.kick }); });
}

/* ───────── 채팅·감정표현 ───────── */
const EMOTES = ['👍', '👏', '😄', '😎', '🤑', '🔥', '🤔', '👀', '⏳', '😱', '😭', '💀'];   // 긍정 → 반응 → 부정 순
const CHAT = { lines: [], bubbles: {} };
function bubbleFor(name) {
  const b = CHAT.bubbles[name];
  if (!b || Date.now() > b.until) return null;
  const d = document.createElement('div'); d.className = 'bubble' + (b.emote ? ' emote' : ''); d.textContent = b.text; return d;
}
function chatPush(name, text, mine) {
  const emote = EMOTES.includes(text);
  CHAT.lines.push({ name, text, mine }); if (CHAT.lines.length > 100) CHAT.lines.shift();
  CHAT.bubbles[name] = { text, emote, until: Date.now() + 3500 };
  renderChat(); render();
  setTimeout(render, 3700);
}
function renderChat() {
  const el = $('chat'); if (!el) return;
  el.innerHTML = CHAT.lines.slice(-60).map((l) => '<div class="cl' + (l.mine ? ' me' : '') + '"><b>' + esc(l.name) + '</b> ' + esc(l.text) + '</div>').join('');
  el.scrollTop = el.scrollHeight;
  const cd = $('cdLines');

const actClass = (p) => p.lastType || '';
/** 연출 상태: 같은 핸드 안에서 이미 보여준 카드·배지는 다시 애니메이션하지 않는다 */
const FX = { hand: -1, boardN: 0, heroDealt: false, revealed: new Set(), bets: {}, acts: {}, pot: 0, winners: new Set(), winHand: -1 };
/**
 * 상대 좌석 위치(%). 좌석은 레일 위에 앉힌다.
 * 5명 이상이면 양옆 아래까지 넓게 펴서 보드(가운데 카드)와 겹치지 않게 한다.
 */
const SEAT_SLOTS = {   // 5명 이상: 각도표 (270 = 위, 180 = 왼쪽). 정확히 옆(보드 높이)에는 두지 않아 보드와 안 겹친다
  5: [205, 240, 270, 300, 335],
  6: [195, 228, 258, 282, 312, 345],
  7: [170, 200, 232, 270, 308, 340, 10],
  8: [160, 192, 224, 254, 286, 316, 348, 20],
};
function seatPos(k, n) {
  const mob = window.innerWidth <= 720;
  let deg;
  if (SEAT_SLOTS[n]) deg = SEAT_SLOTS[n][k];
  else { const START = mob ? 172 : 170, SPAN = mob ? 196 : 200; deg = START + ((k + 1) * SPAN) / (n + 1); }
  const wide = n >= 5;
  const RX = wide ? (mob ? 40 : 46) : (mob ? 40 : 45);
  const RY = wide ? (mob ? 42 : 45) : (mob ? 36 : 40);
  const CY = wide ? (mob ? 49 : 51) : (mob ? 44 : 48);
  const t = deg * Math.PI / 180;
  return [50 + RX * Math.cos(t), CY + RY * Math.sin(t)];
}
/** 팟에서 승자 자리로 칩이 날아간다 */
function flyChips(viewSeats) {
  const felt = $('felt'); if (!felt || !viewSeats.length) return;
  const fr = felt.getBoundingClientRect();
  const from = $('pot') ? $('pot').getBoundingClientRect() : fr;
  const fx = from.left + from.width / 2 - fr.left - fr.width / 2, fy = from.top + from.height / 2 - fr.top - fr.height / 2;
  const COLORS = ['#C9A227', '#C0483C', '#2E6FD8', '#2E9E6E', '#111'];
  viewSeats.forEach((v) => {
    const el = v === 0 ? $('heroStack') : felt.querySelector('.seat[data-seat="' + v + '"] .plate');
    if (!el) return;
    const r = el.getBoundingClientRect();
    const dx = r.left + r.width / 2 - fr.left - fr.width / 2 - fx, dy = r.top + r.height / 2 - fr.top - fr.height / 2 - fy;
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('i'); c.className = 'chip';
      c.style.setProperty('--c', COLORS[i % COLORS.length]);
      c.style.setProperty('--dx', (dx + (Math.random() - 0.5) * 28) + 'px'); c.style.setProperty('--dy', (dy + (Math.random() - 0.5) * 18) + 'px');
      c.style.setProperty('--d', (i * 0.05) + 's'); c.style.setProperty('--t', (0.65 + Math.random() * 0.25) + 's');
      c.style.left = 'calc(50% + ' + fx + 'px)'; c.style.top = 'calc(50% + ' + fy + 'px)';
      felt.appendChild(c);
      setTimeout(() => c.remove(), 1600);
    }
  });
}
/** 시작 칩 대비 부활 비율·금액 (서버 규칙과 같다: 처음 50%, 그 뒤 10%) */
const rebuyPct = (p) => ((p.rebuys || 0) === 0 ? 50 : 10);
const rebuyAmt = (p) => Math.max(CFG.bb, Math.round(CFG.stack * rebuyPct(p) / 100));
/** 누군가 부활했다: 나면 크게 알리고 칩이 날아온다, 남이면 좌석 말풍선 */

function renderActions() {
  const a = $('actions'); a.innerHTML = '';
  const me = G.players[0];
  renderAwayBox();
  if (MODE.net && me.away) {
    $('msg').innerHTML = me.away === 'bot' ? '<b>AI 대리 중</b><br>봇이 대신 칩니다' : '<b>자리 비움 중</b><br>다음 핸드부터 딜 제외';
    const row = document.createElement('div'); row.className = 'actrow main single'; a.appendChild(row);
    const b = document.createElement('button'); b.className = 'abtn raise'; b.textContent = '돌아오기'; b.onclick = () => setAway(''); row.appendChild(b);
    return;
  }
  if (G.stage === 'paused') { $('msg').innerHTML = '<b>잠시 멈춤</b><br>칠 사람이 1명뿐'; return; }
  if (G.stage === 'idle' || G.stage === 'over') return showStartButton();
  if (G.toAct !== 0 || G.stage === 'showdown' || me.folded || me.out) {
    if (MODE.net && (me.out || me.stack <= 0)) $('msg').innerHTML = '<b>파산</b><br>다음 핸드 ' + fmt(rebuyAmt(me)) + '으로 재시작 (' + rebuyPct(me) + '%)';
    else if (G.stage === 'showdown') { if (REVEAL.on) $('msg').textContent = '쇼다운 · 패 공개 중'; }
    else $('msg').textContent = G.toAct >= 0 ? G.players[G.toAct].name + ' 차례' : (MODE.net && G.stage === 'idle' ? '방장이 시작하면 딜' : '');
    return;
  }
  const toCall = G.maxBet - me.bet;
  $('msg').textContent = toCall > 0 ? '콜 ' + fmt(Math.min(toCall, me.stack)) + ' 필요' : '체크 가능';

  const row1 = document.createElement('div'); row1.className = 'actrow main'; a.appendChild(row1);
  const mk = (label, cls, fn, dis) => {
    const b = document.createElement('button');
    b.className = 'abtn ' + cls; b.textContent = label; b.disabled = !!dis; b.onclick = fn;
    row1.appendChild(b); return b;
  };
  mk('폴드', 'fold', () => doAction(0, 'fold'));
  if (toCall === 0) mk('체크', '', () => doAction(0, 'check'));
  else mk('콜 ' + fmt(Math.min(toCall, me.stack)), 'call', () => doAction(0, 'call'));

  // 베팅 버튼: 슬라이더 대신 포커 앱처럼 정해진 크기를 바로 누른다
  const minTo = Math.min(G.maxBet + G.minRaise, me.bet + me.stack);   // 삥 = 최소 벳/레이즈
  const maxTo = me.bet + me.stack;
  const pot = potTotal();
  const step = STEP();
  const snap = (v) => Math.max(minTo, Math.min(maxTo, Math.round(v / step) * step));
  if (maxTo > G.maxBet) {
    const box = document.createElement('div'); box.className = 'actrow betbox';
    // 앞에 베팅이 없으면 삥(최소 벳), 있으면 따당(앞 베팅의 2배). 쿼터·하프·풀은 팟 기준
    const sizes = [
      toCall > 0 ? ['따당', Math.max(minTo, G.maxBet * 2)] : ['삥', minTo],
      ['쿼터', G.maxBet + Math.round((pot + toCall) / 4)],
      ['하프', G.maxBet + Math.round((pot + toCall) / 2)],
      ['풀', G.maxBet + pot + toCall],
    ].map(([l, v]) => [l, snap(v)]);
    const seen = new Set();
    sizes.forEach(([l, v]) => {
      if (v >= maxTo || seen.has(v)) return;           // 올인과 같거나 중복이면 생략
      seen.add(v);
      const bb = document.createElement('button');
      bb.className = 'abtn bet'; bb.innerHTML = l + '<small>' + fmt(v) + '</small>';
      bb.onclick = () => doAction(0, 'raise', v);
      box.appendChild(bb);
    });
    if (box.children.length) a.appendChild(box);
  }
  mk('올인', 'allin', () => doAction(0, 'raise', me.bet + me.stack)).innerHTML = '올인<small>' + fmt(me.stack) + '</small>';
}

function renderAdvisorBox() {

  const outP = ou.n ? (left >= 2 ? Math.min(0.95, ou.n * 4 / 100) : ou.n * 2 / 100) : 0;

    const bh = HE.beatingHands(me.hole, G.board);
    const tex = HE.boardTexture(G.board);

    head = '<div class="advhand"><span class="lb">' + HE.handName(bf.score) + '</span>' +
      '<span class="tier ' + strength[1] + '">' + strength[0] + '</span></div>';
    why = postflopWhy(bf, bh, tex, ou, outP, left, opp);
  }

  let rows = '';

  row('승률 (' + opp + '명 상대)', (eq * 100).toFixed(1) + '<small>%</small>');
  if (G.board.length < 5 && ou.n) row('아웃츠', ou.n + '<small>장</small> · 개선 ' + (outP * 100).toFixed(0) + '<small>%</small>');
  if (toCall > 0) row('팟오즈', (potOdds * 100).toFixed(1) + '<small>% 이상 필요</small>');

  let verdict = '', vc = 'mid';

  } else if (eq >= potOdds + 0.12) { verdict = '승률 ' + (eq * 100).toFixed(0) + '%가 필요 승률 ' + (potOdds * 100).toFixed(0) + '%를 크게 넘습니다. 콜 또는 레이즈가 유리합니다.'; vc = 'go'; }
  else if (eq >= potOdds) { verdict = '승률이 필요 승률보다 조금 높습니다. 콜 가치가 있습니다.'; vc = 'mid'; }
  else { verdict = '승률 ' + (eq * 100).toFixed(0) + '%가 필요 승률 ' + (potOdds * 100).toFixed(0) + '%에 못 미칩니다. 폴드가 손실을 줄입니다.'; vc = 'no'; }

  let ol = '';
  if (G.board.length >= 3 && G.board.length < 5) {
    const o = HE.outlook(me.hole, G.board);
    const top = o.dist.filter((x) => x.p >= 0.005).slice(0, 5);
    const mx = Math.max(...top.map((x) => x.p), 0.001);
    ol = '<div class="outlook"><div style="font-size:11.5px;color:var(--ink-2);margin-bottom:5px">리버까지 완성 가능한 족보</div>' +
      top.map((x) => '<div class="olrow"><span>' + HE.CATS[x.cat].ko + '</span>' +
        '<span class="bar"><i style="width:' + (x.p / mx * 100) + '%"></i></span>' +
        '<span class="p">' + (x.p * 100).toFixed(1) + '%</span></div>').join('') + '</div>';
  }

  box.innerHTML = head + why + rows +
    '<div class="meter"><i style="width:' + (eq * 100).toFixed(1) + '%"></i></div>' +
    '<div class="verdict ' + vc + '">' + verdict + '</div>' + ol;
}

const TIER_LABEL = { S: '최상위', A: '강함', B: '괜찮음', C: '보통', D: '약함' };
const RK = HE.rankName;

function nickname(hc) {
  if (hc.pair) return '포켓 ' + (hc.hi === 14 ? '에이스' : hc.hi === 13 ? '킹' : hc.hi === 12 ? '퀸' : hc.hi === 11 ? '잭' : RK(hc.hi));
  if (hc.hi === 14 && hc.lo === 13) return '빅 슬릭';
  if (hc.suited && hc.gap === 1) return '수티드 커넥터';
  if (hc.suited && hc.hi === 14) return '수티드 에이스';
  if (hc.suited) return '수티드';
  if (hc.hi >= 12 && hc.lo >= 10) return '브로드웨이';
  return '오프수트';
}

/** 프리플랍 해설: 왜 강한지, 무엇에 지는지, 무엇을 조심할지 */
function preflopWhy(hc, eq1, opp, eqNow) {
  const p = [];
  const pct = (x) => (x * 100).toFixed(0) + '%';
  if (hc.pair && hc.hi === 14) {
    p.push('169개 시작 핸드 중 <b>1위</b>입니다. 프리플랍에서 이 손을 이기는 시작 핸드는 <b>없습니다</b>.');
    p.push('다만 상대가 많아질수록 승률이 빠르게 떨어집니다. 1명 상대 ' + pct(eq1) + ', 지금 ' + opp + '명 상대로는 ' + pct(eqNow) + '. <b>레이즈로 상대 수를 줄이는 것</b>이 정석입니다.');
    p.push('지는 경우는 대부분 플랍 이후입니다. 상대가 <b>셋(트리플)</b>을 만들거나 보드에 스트레이트·플러시가 깔릴 때 조심하세요.');
  } else if (hc.pair && hc.hi === 13) {
    p.push('AA 다음으로 강한 손입니다. 프리플랍에서 지는 상대는 <b>AA뿐</b>이며, 그 확률은 매우 낮습니다.');
    p.push('보드에 <b>A가 깔리면</b> 상대의 에이스 페어에 밀릴 수 있으니 그때부터는 신중하게 진행하세요.');
  } else if (hc.pair && hc.hi >= 11) {
    p.push('상위 포켓페어로 충분히 강합니다. 프리플랍에서 앞서는 손은 <b>더 높은 포켓페어</b>뿐입니다.');
    p.push('보드에 <b>' + (hc.hi === 12 ? 'A나 K' : 'A·K·Q') + '가 깔리면</b> 상대의 오버카드 페어에 역전될 수 있습니다.');
  } else if (hc.pair) {
    p.push('작은 포켓페어입니다. 그 자체로는 약하지만 <b>플랍에서 셋이 되면</b> 매우 강해집니다(확률 약 12%).');
    p.push('싸게 플랍을 보고 셋이 안 되면 미련 없이 접는 전략이 기본입니다.');
  } else if (hc.hi === 14 && hc.lo === 13) {
    p.push('페어가 아닌 손 중 <b>가장 강합니다</b>. 탑페어가 되면 킥커 싸움에서 거의 지지 않습니다.' + (hc.suited ? ' 수티드라 <b>넛 플러시</b> 가능성까지 있습니다.' : ''));
    p.push('단점은 <b>맞지 않으면 그냥 A 하이</b>라는 점입니다. 플랍에서 미스했다면 과감히 접을 줄 알아야 합니다.');
  } else if (hc.hi === 14) {
    p.push(hc.suited ? '수티드 에이스입니다. <b>플러시가 되면 최상위(넛)</b>가 됩니다.' : '에이스를 든 손입니다. 페어가 되면 강하지만 <b>킥커가 낮아</b> 같은 에이스끼리 붙으면 밀립니다.');
    p.push('낮은 카드로 페어를 맞췄을 때 무리하지 않는 것이 중요합니다.');
  } else if (hc.suited && hc.gap <= 2) {
    p.push('수티드 커넥터입니다. 당장은 약해 보여도 <b>스트레이트·플러시 잠재력</b>이 큽니다.');
    p.push('여러 명이 들어온 큰 팟에서 값싸게 볼 때 가치가 높고, 완성되지 않으면 쉽게 접어야 합니다.');
  } else if (hc.hi >= 12 && hc.lo >= 10) {
    p.push('브로드웨이 카드 조합입니다. 탑페어를 만들면 쓸 만하지만 <b>킥커 문제</b>로 역전당하기 쉽습니다.');
  } else {
    p.push('<b>가장 약한 축</b>의 시작 핸드입니다. 1명 상대 승률도 ' + pct(eq1) + ' 수준입니다.');
    p.push('장기적으로는 <b>프리플랍에서 접는 것</b>이 칩을 아끼는 길입니다.');
  }
  return p.map((t) => '<p class="why">' + t + '</p>').join('');
}

/** 플랍 이후 해설: 나를 이기는 조합과 보드 위험 */
function postflopWhy(bf, bh, tex, ou, outP, left, opp) {
  const p = [];
  if (bh) {
    const pctBeat = bh.beat / bh.total * 100;
    const catNames = Object.entries(bh.cats).sort((a, b) => b[1] - a[1]).slice(0, 3)
      .map(([c]) => HE.CATS[c].ko);
    if (bh.beat === 0) {
      p.push('현재 이 보드에서 <b class="safe">나를 이길 수 있는 조합이 없습니다</b>. 최대한 팟을 키울 자리입니다.');
    } else {
      p.push('상대가 가질 수 있는 <b>' + fmt(bh.total) + '개 조합 중 ' + fmt(bh.beat) + '개(' + pctBeat.toFixed(1) + '%)</b>가 나를 이깁니다.' +
        (catNames.length ? ' 주로 <b>' + catNames.join(', ') + '</b>입니다.' : ''));
    }
    p.push('단, 이는 <b>상대 1명 기준</b>입니다. 상대가 ' + opp + '명이면 그중 누군가 그 조합을 들고 있을 가능성이 그만큼 커집니다.');
  }
  if (ou.n && left > 0) {
    p.push('아직 <b>' + ou.n + '장</b>이 남아 있어 ' + (left >= 2 ? '리버까지 약 ' : '리버에서 약 ') +
      '<b>' + (outP * 100).toFixed(0) + '%</b> 확률로 지금보다 좋은 족보가 됩니다. (아웃츠 × ' + (left >= 2 ? 4 : 2) + '로 어림잡는 방법)');
  }
  let tags = '';
  if (tex.notes.length) tags = '<div class="tags">' + tex.notes.map((n) => '<span class="tag">' + n + '</span>').join('') + '</div>';
  else tags = '<div class="tags"><span class="tag ok">위험 요소 적은 보드</span></div>';
  return p.map((t) => '<p class="why">' + t + '</p>').join('') + tags;
}

/* ───────── 족보표 ───────── */
const RANK_EX = [
  [9, 'As Ks Qs Js Ts'], [8, '9h 8h 7h 6h 5h'], [7, 'Ks Kh Kd Kc 3s'], [6, 'Js Jh Jd 8s 8h'],
  [5, 'Ad Jd 9d 6d 3d'], [4, 'Ts 9h 8d 7c 6s'], [3, '7s 7h 7d Ks 2h'], [2, 'As Ah 9d 9c 4s'],
  [1, 'Qs Qh 8d 5c 2s'], [0, 'As Jh 9d 6c 3s'],
];
const PS = { s: 0, h: 1, d: 2, c: 3 }, PR = { T: 10, J: 11, Q: 12, K: 13, A: 14 };
const parseC = (t) => ({ r: PR[t[0]] || +t[0], s: PS[t[1]] });
function renderRanks() {
  const me = G.players[0];
  let cur = -1;
  if (me && me.hole && me.hole.length) cur = HE.catOf(HE.bestFive(me.hole.concat(G.board)).score);
  const html = RANK_EX.map(([cat, ex], i) =>
    '<div class="rank' + (cat === cur ? ' hit' : '') + '"><span class="no num">' + (i + 1) + '</span>' +
    '<span class="nm">' + HE.CATS[cat].ko + '</span><span class="ex">' +
    ex.split(' ').map((t) => { const c = parseC(t); return '<span class="card xs' + (RED(c.s) ? ' red' : '') + '"><span class="rk">' + HE.rankName(c.r) + '</span><span class="st">' + SUIT[c.s] + '</span></span>'; }).join('') +
    '</span></div>').join('');
  $('ranks').innerHTML = html;
  if ($('ranksPop')) $('ranksPop').innerHTML = html;
}

/* ───────── 로그 ───────── */
function logLine(t, cls) { G.log.push({ t, cls }); if (G.log.length > 200) G.log.shift(); }
function renderLog() {
  const el = $('log');
  el.innerHTML = G.log.slice(-60).map((l) => '<div class="' + (l.cls || '') + '">' + l.t + '</div>').join('');
  el.scrollTop = el.scrollHeight;
}

/* ───────── 설정 ───────── */
function buildOpts() {
  const mk = (host, items, get, set) => {
    const h = $(host); h.innerHTML = '';
    items.forEach(([val, label, sub]) => {
      const b = document.createElement('button');
      b.className = 'opt' + (get() === val ? ' on' : '');
      b.innerHTML = label + (sub ? '<small>' + sub + '</small>' : '');
      b.onclick = () => { set(val); buildOpts(); };
      h.appendChild(b);
    });
  };
  mk('optOpp', [1, 2, 3, 4, 5, 6, 7, 8].map((n) => [n, n + '명']), () => CFG.opp, (v) => CFG.opp = v);
  mk('optDiff', [['easy', '하수', '느슨하게 콜'], ['normal', '중수', '확률 기반'], ['hard', '고수', '위치·블러프'], ['pro', '프로', '3벳·트랩·세미블러프'], ['mix', '섞기', '봇마다 성향 다름']], () => CFG.diff, (v) => CFG.diff = v);
  mk('optAdv', [[true, '받기', '승률·추천 표시'], [false, '안받기', '혼자 판단']], () => CFG.advisor, (v) => CFG.advisor = v);
  mk('optSpeed', [['slow', '느리게', '흐름 파악용'], ['normal', '보통', ''], ['fast', '빠르게', '익숙해지면']], () => CFG.speed, (v) => CFG.speed = v);
  mk('optTurn', [[3, '3초'], [5, '5초'], [10, '10초'], [0, '무제한']], () => CFG.turn, (v) => CFG.turn = v);
  mk('optStack', [[10000, '1만'], [20000, '2만'], [50000, '5만'], [100000, '10만']], () => CFG.stack, (v) => { CFG.stack = v; syncStake(); });
  mk('optBB', [[100, '100'], [200, '200'], [500, '500'], [1000, '1,000']], () => CFG.bb, (v) => { CFG.bb = v; syncStake(); });
  syncStake();
}

/** 시작 칩 / 최소 베팅 입력칸 동기화 및 검증 */
function syncStake() {
  const s = $('inStack'), b = $('inBB');
  if (s.value != CFG.stack) s.value = CFG.stack;
  if (b.value != CFG.bb) b.value = CFG.bb;
  const ratio = Math.floor(CFG.stack / CFG.bb);
  let msg = '스몰블라인드 ' + fmt(SB()) + ' · 시작 칩이 최소 베팅의 ' + fmt(ratio) + '배';
  if (ratio < 10) msg += ' (너무 적어 금방 올인이 됩니다)';
  $('bbHint').textContent = msg;
}
function clampStake() {
  CFG.stack = Math.max(100, Math.min(10000000, Math.round(+$('inStack').value || 10000)));
  CFG.bb = Math.max(2, Math.min(Math.floor(CFG.stack / 2), Math.round(+$('inBB').value || 100)));
}
$('inStack').oninput = () => { clampStake(); syncStake(); buildOpts(); };
$('inBB').oninput = () => { clampStake(); syncStake(); buildOpts(); };
$('inStack').onblur = () => { clampStake(); syncStake(); buildOpts(); };
$('inBB').onblur = () => { clampStake(); syncStake(); buildOpts(); };

/* 모바일 하단 탭: 사이드 패널을 시트로 열고 섹션 전환 */
const isMobile = () => window.innerWidth <= 1080;
/* 족보·어드바이저 팝업 */
const openPop = (id) => { const o = $(id); if (o) o.classList.add('on'); };
const closePop = (id) => { const o = $(id); if (o) o.classList.remove('on'); };
if ($('btnRanks')) $('btnRanks').onclick = () => { renderRanks(); openPop('ovRanks'); };
if ($('closeRanks')) $('closeRanks').onclick = () => closePop('ovRanks');
if ($('closeAdv')) $('closeAdv').onclick = () => closePop('ovAdv');
if ($('toggleAdv')) $('toggleAdv').onclick = () => { CFG.advisor = !CFG.advisor; $('btnAdv').textContent = '어드바이저 ' + (CFG.advisor ? 'ON' : 'OFF'); $('btnAdv').classList.toggle('on', CFG.advisor); renderAdvisor(); };
['ovRanks', 'ovAdv'].forEach((id) => { const o = $(id); if (o && o.addEventListener) o.addEventListener('click', (e) => { if (e.target === o) closePop(id); }); });
window.addEventListener('resize', () => {
  if (!isMobile()) {
    $('side').classList.remove('open');
    document.querySelectorAll('#side .sec').forEach((s) => { s.style.display = ''; });
  }
});
$('btnStart').onclick = () => { $('ov').classList.remove('on'); newGame(); };
function setModeTab(mode) {
  $('ov').querySelector('.modal').classList.toggle('online', mode === 'net');
  $('tabLocal').classList.toggle('on', mode === 'local');
  $('tabNet').classList.toggle('on', mode === 'net');
  if (mode === 'net') { $('serverFld').style.display = (location.protocol === 'http:' || location.protocol === 'https:') ? 'none' : ''; renderLobby(); }
}
$('tabLocal').onclick = () => setModeTab('local');
$('tabNet').onclick = () => setModeTab('net');
$('btnCreate').onclick = () => netCreateOrJoin('');
$('btnJoin').onclick = () => netCreateOrJoin($('inCode').value.trim());
$('inCode').onkeydown = (e) => { if (e.key === 'Enter') netCreateOrJoin($('inCode').value.trim()); };
(function initNet() {
  if (typeof location === 'undefined') return;
  $('inName').value = store.get('ht.name');
  if ($('inServer')) $('inServer').value = store.get('ht.server');
  const q = new URLSearchParams(location.search);
  const room = (q.get('room') || '').toUpperCase();
  const nm = (q.get('name') || '').trim().slice(0, 12);
  if (nm) { store.set('ht.name', nm); $('inName').value = nm; }
  if (q.get('create') != null) { setModeTab('net'); if ($('inName').value) netCreateOrJoin(''); return; }
  const saved = store.get('ht.room');
  if (room) { setModeTab('net'); $('inCode').value = room; if ($('inName').value) netCreateOrJoin(room); else netStatus('이름을 입력하고 참가를 누르세요.'); }
  else if (saved && store.get('ht.token')) { NET.auto = true; setModeTab('net'); $('inCode').value = saved; netCreateOrJoin(saved); }
})();
$('btnSet').onclick = () => { buildOpts(); $('ov').classList.add('on'); };
$('btnAdv').onclick = () => {
  if (isMobile()) { renderAdvisor(); openPop('ovAdv'); return; }   // 폰: 팝업으로 보여준다 (켜기/끄기는 팝업 안에서)
  CFG.advisor = !CFG.advisor;
  $('btnAdv').textContent = '어드바이저 ' + (CFG.advisor ? 'ON' : 'OFF');
  $('btnAdv').classList.toggle('on', CFG.advisor);
  renderAdvisor();
};

buildOpts();
renderRanks();
$('btnAdv').classList.toggle('on', CFG.advisor);
// 홈 화면 앱(PWA): http(s)로 열렸을 때만 등록
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && typeof location !== 'undefined' && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
