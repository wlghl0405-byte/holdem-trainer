<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="홀덤 트레이너">
<meta name="theme-color" content="#0B0E0D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>홀덤 트레이너</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#0B0E0D; --panel:#13181A; --panel-2:#1A2124; --line:#242D30; --line-2:#313C40;
  --ink:#E9EDEB; --ink-2:#93A09A; --mute:#5F6C68;
  --felt:#15402F; --felt-hi:#1D543E; --rail:#2C2118; --rail-hi:#3B2D20;
  --gold:#C9A227; --gold-soft:rgba(201,162,39,.14);
  --card:#F6F4EC; --card-ink:#171A19; --card-red:#B23C31;
  --good:#3E9E6E; --bad:#C0483C; --info:#4B84D8;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.5; letter-spacing:-.01em; word-break:keep-all; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ── 레이아웃 ── */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:15px;font-weight:750;letter-spacing:-.02em}
header h1 span{color:var(--gold)}
.hstat{display:flex;gap:16px;margin-left:auto;align-items:center;font-size:12.5px;color:var(--ink-2)}
.hstat b{color:var(--ink);font-weight:700}
.tbtn{border:1px solid var(--line-2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:650;color:var(--ink-2);background:var(--panel-2)}
.tbtn:hover{color:var(--ink);border-color:var(--gold)}
.tbtn.on{background:var(--gold);color:#20180A;border-color:transparent}

main{display:grid;grid-template-columns:1fr 340px;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 16px 0}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px}

/* ── 테이블 ── */
.tablewrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.felt{
  position:relative;width:min(100%,860px);aspect-ratio:16/9;border-radius:46% / 52%;
  background:radial-gradient(ellipse at 50% 44%, var(--felt-hi) 0%, var(--felt) 58%, #0F3325 100%);
  border:13px solid var(--rail);
  box-shadow:0 0 0 2px #0A0D0C inset, 0 22px 60px rgba(0,0,0,.55), 0 0 0 1px var(--rail-hi);
}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;width:82%}
.potline{font-size:12px;color:rgba(255,255,255,.5);font-weight:650;letter-spacing:.04em}
.pot{font-size:23px;font-weight:800;color:var(--gold);margin-top:1px}
.board{display:flex;gap:7px;justify-content:center;margin-top:11px;min-height:78px}
.stagetag{margin-top:8px;font-size:11.5px;color:rgba(255,255,255,.42);font-weight:650}

/* 카드 */
.card{width:54px;height:76px;border-radius:7px;background:var(--card);color:var(--card-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  box-shadow:0 3px 10px rgba(0,0,0,.4);flex:0 0 auto;font-weight:750;user-select:none}
.card .rk{font-size:20px;line-height:1}
.card .st{font-size:19px;line-height:1;margin-top:1px}
.card.red{color:var(--card-red)}
.card.sm{width:38px;height:54px;border-radius:5px}
.card.sm .rk{font-size:14px}.card.sm .st{font-size:13px}
.card.xs{width:26px;height:36px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.card.xs .rk{font-size:10.5px}.card.xs .st{font-size:10px}
.card.back{background:repeating-linear-gradient(45deg,#2E4A63 0 5px,#24394D 5px 10px);border:2px solid #14202B;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.card.best{box-shadow:0 0 0 2px var(--gold), 0 3px 12px rgba(201,162,39,.4)}
.card.ph{background:rgba(255,255,255,.05);box-shadow:none;border:1px dashed rgba(255,255,255,.14)}
.deal{animation:deal .28s cubic-bezier(.2,.8,.2,1)}
@keyframes deal{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1}}

/* 액션 알림 (누가 무엇을 했는지 크게) */
.ann{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%) scale(.9);z-index:11;
  display:flex;align-items:center;justify-content:center;line-height:1;
  background:rgba(8,13,11,.9);border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:9px 16px;font-size:14px;font-weight:750;white-space:nowrap;color:var(--ink);
  opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.ann .anncard{display:inline-flex;align-items:center;gap:1px;background:var(--card);color:var(--card-ink);
  border-radius:4px;padding:3px 6px;margin-left:8px;font-size:13px;font-weight:850;line-height:1}
.ann .anncard.red{color:var(--card-red)}
.ann.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ann .who{color:var(--ink-2);font-weight:650;margin-right:5px}
.ann.raise{border-color:var(--gold);color:var(--gold)}
.ann.call{border-color:#4B84D8;color:#9FC0F0}
.ann.fold{color:var(--mute)}
.ann.allin{border-color:var(--bad);color:#EFA69E}
.ann.stage{background:rgba(201,162,39,.16);border-color:var(--gold);color:#EBD9A0;font-size:15px;letter-spacing:.04em}

/* 핸드 결과 */
.result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:12;pointer-events:none;padding:12px}
.result.on{display:flex}
.rcard{background:rgba(8,13,11,.9);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:16px 26px 18px;
  text-align:center;backdrop-filter:blur(8px);box-shadow:0 20px 56px rgba(0,0,0,.65);max-width:94%;
  animation:pop .34s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.rlabel{font-size:40px;font-weight:900;letter-spacing:.08em;line-height:1}
.rlabel.win{color:var(--gold);text-shadow:0 0 26px rgba(201,162,39,.45)}
.rlabel.lose{color:#DE6A60}
.rlabel.draw{color:#9FC0F0}
.rlabel.fold{color:#7C8A86;letter-spacing:.1em}
.rdelta.fold{color:var(--ink-2)}
.rdelta{font-size:21px;font-weight:850;margin-top:5px;font-variant-numeric:tabular-nums}
.rdelta.win{color:var(--gold)}.rdelta.lose{color:#DE6A60}.rdelta.draw{color:var(--ink-2)}
.rwho{font-size:13.5px;color:var(--ink);font-weight:700;margin-top:9px}
.rwho b{color:var(--gold)}
.rsub{font-size:12px;color:var(--ink-2);margin-top:3px}
.rcards{display:flex;gap:5px;justify-content:center;margin-top:10px}
.rcards .card{box-shadow:0 3px 10px rgba(0,0,0,.5)}
/* 쇼다운 비교표 */
.rshow{margin-top:11px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:9px;text-align:left}
.rrow .rn{font-size:12.5px;font-weight:800;min-width:44px;color:var(--ink-2)}
.rrow.w .rn{color:var(--gold)}
.rrow .rh{font-size:12.5px;font-weight:700;min-width:96px}
.rrow.w .rh{color:var(--gold)}
.rrow .rc{display:flex;gap:3px;margin-left:auto}
.rrow.w .rc .card{box-shadow:0 0 0 1.5px var(--gold), 0 2px 6px rgba(0,0,0,.5)}
.rhole{display:flex;gap:3px;margin-right:2px;padding-right:7px;border-right:1px dashed rgba(255,255,255,.18)}
@media (prefers-reduced-motion:reduce){.rcard{animation:none}}

/* 좌석 */
.seat{position:absolute;transform:translate(-50%,-50%);width:132px;text-align:center}
.seat .cards{display:flex;gap:4px;justify-content:center;margin-bottom:5px;min-height:54px}
.seat .plate{background:rgba(8,14,12,.82);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:5px 8px}
.seat .nm .sty{font-size:10px;color:var(--gold);font-weight:600;margin-left:3px}
.seat .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ch{font-size:12.5px;font-weight:750;color:var(--gold);margin-top:1px}
.seat.turn .plate{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.seat.folded{opacity:.4}
.seat.out{opacity:.22;filter:grayscale(1)}
.seat .act{position:absolute;left:50%;transform:translateX(-50%);bottom:-23px;font-size:12px;font-weight:800;
  padding:3px 11px;border-radius:999px;background:rgba(10,16,14,.92);border:1.5px solid var(--line-2);white-space:nowrap;
  box-shadow:0 3px 10px rgba(0,0,0,.45)}
.seat .act.fold{color:var(--mute);border-color:var(--line)}
.seat .act.raise{color:#20180A;background:var(--gold);border-color:transparent}
.seat .act.call{color:#DCE9FF;border-color:var(--info)}
.seat .act.check{color:var(--ink-2)}
.seat .act.blind{color:#EBD9A0;border-color:rgba(201,162,39,.5)}
.seat .act.allin{color:#fff;background:var(--bad);border-color:transparent}
.seat .bet{position:absolute;left:50%;transform:translateX(-50%);bottom:-44px;font-size:11.5px;font-weight:750;color:#EBD9A0}
.dbtn{position:absolute;top:-6px;right:6px;width:19px;height:19px;border-radius:50%;background:var(--card);
  color:#171A19;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.4)}

/* 내 자리 */
.hero{display:flex;align-items:center;gap:16px;justify-content:center;padding:14px 0 8px}
.hero .cards{display:flex;gap:7px}
.hero .info{text-align:left}
.hero .nm{font-size:13px;font-weight:750}
.hero .ch{font-size:20px;font-weight:800;color:var(--gold)}
.hero .made{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.hero .made b{color:var(--ink)}
.hero.turn .info{position:relative}
.hero.turn .nm::after{content:"내 차례";margin-left:8px;font-size:10.5px;color:var(--gold);border:1px solid var(--gold);padding:1px 7px;border-radius:999px;vertical-align:2px}

/* 액션바 */
.actions{display:flex;gap:9px;align-items:center;justify-content:center;padding:10px 0 16px;flex-wrap:wrap;min-height:64px}
.abtn{min-width:96px;padding:12px 18px;border-radius:11px;font-size:14.5px;font-weight:750;border:1px solid var(--line-2);background:var(--panel-2);transition:transform .08s}
.abtn:active{transform:scale(.98)}
.abtn:disabled{opacity:.32;cursor:default}
.abtn.fold{color:#D9908A}
.abtn.call{background:var(--info);border-color:transparent;color:#fff}
.abtn.raise{background:var(--gold);border-color:transparent;color:#20180A}
.abtn.allin{border-color:var(--bad);color:#E8938B}
.raisebox{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 12px}
.raisebox input[type=range]{width:150px;accent-color:var(--gold)}
.raisebox .amt{font-size:14px;font-weight:800;color:var(--gold);min-width:64px;text-align:right}
.msg{text-align:center;font-size:13.5px;color:var(--ink-2);padding:6px 0;min-height:26px}
.msg b{color:var(--gold)}

/* ── 사이드바 ── */
.sec{margin-bottom:14px}
.sec h2{margin:0 0 8px;font-size:12px;font-weight:750;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.sec h2 .r{margin-left:auto;font-size:11px;color:var(--mute);font-weight:600}
.box{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}

/* 어드바이저 */
.adv-off{color:var(--mute);font-size:12.5px;text-align:center;padding:14px 8px}
.advrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0}
.advrow+.advrow{border-top:1px solid var(--line)}
.advrow .k{font-size:12px;color:var(--ink-2)}
.advrow .v{font-size:13.5px;font-weight:750;text-align:right}
.advrow .v small{font-size:11px;color:var(--ink-2);font-weight:600;margin-left:3px}
.meter{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3E9E6E,#7FD3A6)}
.verdict{margin-top:10px;padding:9px 11px;border-radius:9px;font-size:12.5px;font-weight:700;line-height:1.5}
.verdict.go{background:rgba(62,158,110,.15);color:#7FD3A6}
.verdict.no{background:rgba(192,72,60,.15);color:#E29A92}
.verdict.mid{background:rgba(75,132,216,.14);color:#9FC0F0}
.advhand{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.advhand .lb{font-size:15px;font-weight:800}
.advhand .nk{font-size:12px;color:var(--ink-2);font-weight:650}
.tier{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.tier.S{background:var(--gold);color:#20180A}
.tier.A{background:#3E9E6E;color:#04160D}
.tier.B{background:#4B84D8;color:#04101F}
.tier.C{background:#4A5654;color:#DCE3E1}
.tier.D{background:#8C382F;color:#FFE6E2}
.why{font-size:12px;line-height:1.65;color:var(--ink-2);margin:0 0 9px}
.why b{color:var(--ink);font-weight:700}
.why+.why{margin-top:-4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(192,72,60,.16);color:#E8A79F}
.tag.ok{background:rgba(62,158,110,.16);color:#8FD9B2}
.beatline{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.beatline b{color:#E8A79F}
.beatline .safe{color:#8FD9B2}
.outlook{margin-top:9px}
.olrow{display:grid;grid-template-columns:78px 1fr 42px;gap:7px;align-items:center;font-size:11.5px;padding:2px 0}
.olrow .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.olrow .bar i{display:block;height:100%;background:var(--gold);opacity:.85}
.olrow .p{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* 족보표 */
.rank{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:8px}
.rank+.rank{margin-top:1px}
.rank .no{font-size:10.5px;color:var(--mute);width:15px;font-weight:700;text-align:center}
.rank .nm{font-size:12.5px;font-weight:700;width:96px;flex:0 0 auto}
.rank .ex{display:flex;gap:2px}
.rank.hit{background:var(--gold-soft);box-shadow:inset 0 0 0 1px rgba(201,162,39,.4)}
.rank.hit .nm{color:var(--gold)}

/* 로그 */
.log{max-height:190px;overflow-y:auto;font-size:12px;line-height:1.65}
.log div{padding:1px 0;color:var(--ink-2)}
.log .hd{color:var(--gold);font-weight:700;margin-top:5px}
.log .win{color:#7FD3A6;font-weight:650}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(5,8,7,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:22px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 4px;font-size:18px;font-weight:800}
.modal p.sub{margin:0 0 18px;font-size:12.5px;color:var(--ink-2)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:7px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{padding:8px 14px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2)}
.opt.on{background:var(--gold);color:#20180A;border-color:transparent}
.opt small{display:block;font-size:10.5px;font-weight:600;opacity:.75;margin-top:1px}
.start{width:100%;padding:14px;border-radius:12px;background:var(--gold);color:#20180A;font-size:15px;font-weight:800;margin-top:4px}
.hint{font-size:11.5px;color:var(--mute);margin-top:8px;line-height:1.6}
.numin{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  color:var(--ink);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;outline:none;margin-top:7px;font-family:inherit}
.numin:focus{border-color:var(--gold)}
.warn{font-size:11.5px;color:#E29A92;margin-top:6px}

/* ── 모바일 탭바 (폰에서만 노출) ── */
.mtabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(15,20,21,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0)}
.mtabs button{flex:1;min-height:50px;font-size:12px;font-weight:700;color:var(--mute)}
.mtabs button.on{color:var(--gold)}

/* ── 모바일: 스크롤 없이 한 화면에 정확히 맞춘다 ── */
@media (max-width:1080px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .app{height:100dvh;height:100svh}
  main{grid-template-columns:1fr;min-height:0}
  .mtabs{display:flex}
  /* 상태바(시계·배터리) 영역 확보 */
  header{padding:calc(7px + env(safe-area-inset-top,0)) 12px 7px;gap:8px}
  header h1{font-size:14px}
  .hstat{gap:10px;font-size:11.5px}
  .hstat span:nth-child(2){display:none}
  .tbtn{padding:6px 10px;font-size:11.5px}
  /* 테이블이 남는 공간을 전부 차지하고, 그 아래 요소는 고정 높이 */
  .stage{display:flex;flex-direction:column;min-height:0;
    padding:8px 10px calc(52px + env(safe-area-inset-bottom,0))}
  .tablewrap{flex:1 1 auto;min-height:0}
  .felt{width:100%;height:100%;max-width:none;aspect-ratio:auto;border-radius:50%;border-width:9px}
  .hero,.msg,.actions{flex:0 0 auto}
  /* 사이드바를 하단 시트로 */
  aside{position:fixed;left:0;right:0;bottom:0;height:66dvh;z-index:45;
    border-left:none;border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;
    transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    padding:16px 14px calc(64px + env(safe-area-inset-bottom,0));box-shadow:0 -14px 40px rgba(0,0,0,.5)}
  aside.open{transform:none}
}
/* 폰 세로: 좌석·카드·액션을 화면에 맞게 압축 */
@media (max-width:720px){
  .center{width:78%;top:48%}
  .potline{font-size:10.5px}
  .pot{font-size:19px;margin-top:0}
  .board{gap:4px;min-height:0;margin-top:7px}
  .stagetag{margin-top:5px;font-size:10.5px}
  .card{width:38px;height:53px;border-radius:6px}
  .card .rk{font-size:14px}.card .st{font-size:13px}
  .card.sm{width:23px;height:32px;border-radius:4px}
  .card.sm .rk{font-size:9px}.card.sm .st{font-size:8.5px}

<script src="engine.js"></script>
<script src="table.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
const SUIT = HE.SUIT_CH;
const RED = (s) => s === 1 || s === 2;

/* ───────── 상태 ───────── */
const CFG = { opp: 3, diff: 'normal', advisor: true, stack: 10000, bb: 100, speed: 'slow', turn: 30 };
// 진행 속도. 초보자가 흐름을 따라갈 수 있도록 기본은 '느리게'.
const SPEEDS = {
  slow: { ai: 1500, stage: 1400, ann: 1500 },
  normal: { ai: 800, stage: 800, ann: 900 },
  fast: { ai: 360, stage: 420, ann: 520 },
  folded: { ai: 260, stage: 300, ann: 400 },  // 내가 폴드한 판은 빠르게 넘긴다
};
const SP = () => {
  const me = G.players[0];
  if (me && me.folded && G.stage !== 'showdown') return SPEEDS.folded;
  return SPEEDS[CFG.speed] || SPEEDS.slow;
};
// 최소 베팅 = 빅블라인드. 스몰블라인드는 그 절반(홀수면 내림, 최소 1).
const SB = () => Math.max(1, Math.floor(CFG.bb / 2));
const STEP = () => Math.max(1, Math.floor(CFG.bb / 2));
const DIFF_NAME = { easy: '초급', normal: '중급', hard: '고수', pro: '프로', mix: '섞기' };

/*
 * 게임 진행은 table.js(TB.Table)가 맡는다. 화면은 G를 읽어 그린다.
 *   혼자 연습: G = 브라우저 안의 Table 인스턴스(T) 그 자체
 *   온라인   : G = 서버가 보내주는 내 좌석 기준 화면 상태(view). 덱·남의 패는 없다.
 */
const MODE = { net: false };
const T = new TB.Table(CFG, onTableEvent);
let G = T;
let RES = null;               // 마지막 핸드 결과(오버레이용)

function onTableEvent(type, data) {
  if (type === 'action') announceAction(data);
  else if (type === 'stage') announceStage(data);
  else if (type === 'result') RES = data;
}

/* ───────── 카드 렌더 ───────── */
function cardEl(c, cls) {
  const d = document.createElement('div');
  d.className = 'card ' + (cls || '');
  if (!c) { d.className += ' back'; return d; }
  if (RED(c.s)) d.classList.add('red');
  d.innerHTML = '<span class="rk">' + HE.rankName(c.r) + '</span><span class="st">' + SUIT[c.s] + '</span>';
  return d;
}
function ph() { const d = document.createElement('div'); d.className = 'card ph'; return d; }

/* ───────── 혼자 연습: 게임 시작·진행 ───────── */
function newGame() {
  MODE.net = false; G = T; RES = null;
  T.reset();
  T.addPlayer({ id: 0, name: '나', human: true, stack: CFG.stack });
  T.addBots(CFG.opp);
  $('hBlind').textContent = fmt(SB()) + ' / ' + fmt(CFG.bb);
  $('hDiff').textContent = DIFF_NAME[CFG.diff];
  renderRanks();
  $('result').classList.remove('on');
  render();                       // 테이블만 깔고, 시작 버튼을 누르면 첫 핸드가 돈다
}

function alivePlayers() { return G.players.filter((p) => !p.out); }
const inHand = () => G.players.filter((p) => !p.out && !p.folded);
const canAct = () => G.players.filter((p) => !p.out && !p.folded && !p.allIn);
const potTotal = () => G.players.reduce((a, p) => a + p.committed, 0);

function startHand() {
  if (MODE.net) return;
  T.players.forEach((p) => { if (p.stack <= 0) p.out = true; });
  if (T.players[0].out || T.alive().length < 2) return gameOver();
  $('result').classList.remove('on');
  RES = null;
  T.startHand();
  drive();
}

/** 내 액션 (혼자 연습이면 테이블에 직접, 온라인이면 서버로) */
function doAction(i, type, amount) {
  if (MODE.net) { netSend({ t: 'act', type, amount }); return; }
  T.doAction(i, type, amount);
  drive();
}
function endHand() { if (MODE.net) return; T.endHand(); drive(); }

/** 상태가 바뀔 때마다 호출. 다음에 할 일을 보고 타이머를 건다. */
let driveT = null;
function drive() {
  clearTimeout(driveT);
  const p = T.pending();
  render();
  if (p === 'bot') { G.busy = true; driveT = setTimeout(() => { T.next(); drive(); }, SP().ai); }
  else if (p === 'stage') { G.busy = true; driveT = setTimeout(() => { T.next(); drive(); }, SP().stage); }
  else if (p === 'showdown') { G.busy = false; showResult(RES || T.result); showNextButton(); }
  else if (p === 'over') { G.busy = false; gameOver(); }
  else G.busy = false;
}

/** 테이블 위에 최근 액션을 크게 띄운다 */
let annT = null;
function announce(html, cls) {
  const el = $('ann');
  if (!el) return;
  el.innerHTML = html;
  el.className = 'ann on ' + (cls || '');
  clearTimeout(annT);
  annT = setTimeout(() => { el.className = 'ann ' + (cls || ''); }, SP().ann);
}
const annCard = (c) => '<span class="anncard' + (RED(c.s) ? ' red' : '') + '">' + HE.rankName(c.r) + SUIT[c.s] + '</span>';
function announceAction(d) { announce('<span class="who">' + esc(d.name) + '</span>' + d.act, d.cls); }
function announceStage(d) {
  const label = { flop: '플랍', turn: '턴', river: '리버' }[d.stage] || d.stage;
  announce(label + d.cards.map(annCard).join(''), 'stage');
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ───────── 핸드 종료 연출 ───────── */
/** WIN / LOSE 와 승리 족보를 테이블 위에 띄운다 */
function showResult(res) {
  if (!res) return;
  const me = G.players[0];
  const delta = me.stack - (me.handStart == null ? me.stack : me.handStart);
  const iWon = res.iWon != null ? res.iWon : (res.winnerSeats || []).indexOf(0) >= 0;
  const myName = me.name;
  // 폴드는 승패가 아니라 '기권'이다. 손익 0이어도 DRAW(팟 분배)와 구분해서 표기한다.
  const kind = me.folded ? 'fold' : delta > 0 ? 'win' : delta < 0 ? 'lose' : 'draw';
  const label = me.folded ? 'FOLD' : delta > 0 ? 'WIN' : delta < 0 ? 'LOSE' : 'DRAW';
  const others = res.winners.filter((w) => w !== myName);

  let who = '';
  if (iWon && res.winners.length === 1) who = res.allFolded ? '상대가 모두 폴드했습니다' : '내 <b>' + res.hand + '</b> 승리';
  else if (iWon) who = '분할 승리 · <b>' + res.hand + '</b>';
  else if (res.allFolded) who = '<b>' + esc(others.join(', ')) + '</b> 승리 (모두 폴드)';
  else who = '<b>' + esc(others.join(', ')) + '</b> 승리 · ' + res.hand;

  const mini = (c) => '<span class="card sm' + (RED(c.s) ? ' red' : '') + '"><span class="rk">' +
    HE.rankName(c.r) + '</span><span class="st">' + SUIT[c.s] + '</span></span>';

  let body = '';
  if (res.rows && res.rows.length) {
    // 쇼다운: 승자와 내 패를 나란히 비교 (누가 무엇으로 이겼는지)
    const rows = res.rows.map((r) => Object.assign({}, r, { isMe: r.isMe != null ? r.isMe : r.seat === 0 }));
    const winRows = rows.filter((r) => r.win);
    const myRow = rows.find((r) => r.isMe);
    const show = winRows.slice(0, 3);
    if (myRow && !myRow.win) show.push(myRow);
    body = '<div class="rshow">' + show.map((r) =>
      '<div class="rrow' + (r.win ? ' w' : '') + '">' +
      '<span class="rn">' + (r.isMe ? '나' : esc(r.name)) + '</span>' +
      '<span class="rh">' + r.hand + '</span>' +
      '<span class="rc"><span class="rhole">' + r.hole.map(mini).join('') + '</span>' +
      r.cards.map(mini).join('') + '</span></div>').join('') + '</div>';
    if (myRow && !myRow.win) {
      body += '<div class="rsub" style="margin-top:8px">' + (winRows[0] ? esc(winRows[0].name) + '의 <b style="color:#EBD9A0">' + winRows[0].hand + '</b>에 밀렸습니다' : '') + '</div>';
    }
  } else if (res.cards && res.cards.length) {
    body = '<div class="rcards">' + res.cards.map(mini).join('') + '</div>';
  } else if (me.folded && !iWon) {
    body = '<div class="rsub">' + (delta === 0 ? '칩을 걸기 전에 폴드해 손실이 없습니다' : '폴드로 이번 핸드를 넘겼습니다') + '</div>';
  }

  $('result').innerHTML =
    '<div class="rcard">' +
    '<div class="rlabel ' + kind + '">' + label + '</div>' +
    '<div class="rdelta ' + kind + '">' + (delta > 0 ? '+' : '') + fmt(delta) + '</div>' +
    '<div class="rwho">' + who + '</div>' + body + '</div>';
  $('result').classList.add('on');
}

/* ───────── 온라인 ───────── */
/*
 * 서버(server.js)가 덱과 진행을 쥔다. 브라우저는 자기 좌석 기준 화면 상태(view)를 받아 그리고,
 * 액션만 보낸다. 방 코드로 입장하며, 토큰을 저장해 두어 새로고침해도 자리를 잃지 않는다.
 */
const NET = { ws: null, url: '', code: '', seat: -1, host: false, token: '', name: '', lobby: null, retry: null, wantClose: false, seated: false };
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
function defaultServer() {
  if (location.protocol === 'http:' || location.protocol === 'https:') return location.origin;
  return store.get('ht.server') || '';
}
function wsUrl(base) {
  const u = base.replace(/\/+$/, '');
  if (/^wss?:/.test(u)) return u;
  return u.replace(/^http/, 'ws');
}
function netSend(m) { if (NET.ws && NET.ws.readyState === 1) NET.ws.send(JSON.stringify(m)); }

function netConnect(base, onOpen) {
  NET.wantClose = false;
  if (NET.ws) { try { NET.ws.onclose = null; NET.ws.close(); } catch (e) {} }
  let ws;
  try { ws = new WebSocket(wsUrl(base)); } catch (e) { netStatus('서버 주소가 올바르지 않습니다.', true); return; }
  NET.ws = ws; NET.url = base;
  netStatus('서버에 연결하는 중… (무료 서버는 처음 깨우는 데 30초쯤 걸릴 수 있습니다)');
  ws.onopen = () => { netStatus('연결됨'); if (onOpen) onOpen(); };
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } netHandle(m); };
  ws.onerror = () => { netStatus('연결에 실패했습니다. 서버 주소를 확인하세요.', true); };
  ws.onclose = () => {
    if (NET.wantClose) return;
    netStatus('연결이 끊겼습니다. 다시 연결하는 중…', true);
    clearTimeout(NET.retry);
    NET.retry = setTimeout(() => { if (NET.code) netConnect(NET.url, () => netSend({ t: 'join', code: NET.code, name: NET.name, token: NET.token })); }, 2000);
  };
}
function netLeave() {
  NET.wantClose = true; clearTimeout(NET.retry);
  netSend({ t: 'leave' });
  if (NET.ws) { try { NET.ws.close(); } catch (e) {} }
  NET.ws = null; NET.code = ''; NET.seat = -1; NET.host = false; NET.lobby = null; NET.seated = false;
  store.set('ht.room', ''); store.set('ht.token', '');
  MODE.net = false; G = T;
  renderLobby();
}

function netHandle(m) {
  if (m.t === 'joined') {
    NET.code = m.code; NET.seat = m.seat; NET.token = m.token; NET.host = !!m.host;
    store.set('ht.room', m.code); store.set('ht.token', m.token); store.set('ht.server', NET.url);
    netStatus('방 ' + m.code + ' 입장');
    if ($('chatState')) $('chatState').textContent = '방 ' + m.code;
    renderLobby();
  } else if (m.t === 'lobby') {
    NET.lobby = m; NET.host = !!m.host;
    renderLobby();
  } else if (m.t === 'state') {
    MODE.net = true; G = m.view; NET.seated = true;
    if (m.view.cfg) { CFG.bb = m.view.cfg.bb; CFG.stack = m.view.cfg.stack; CFG.diff = m.view.cfg.diff || CFG.diff; }
    if (m.view.result) RES = m.view.result;
    $('ov').classList.remove('on');
    $('hBlind').textContent = fmt(SB()) + ' / ' + fmt(CFG.bb);
    $('hDiff').textContent = '온라인 · 방 ' + NET.code;
    if (G.stage !== 'showdown') $('result').classList.remove('on');
    render();
    if (G.stage === 'showdown') { showResult(RES); showNextButton(); }
  } else if (m.t === 'event') {
    if (m.name === 'action') announceAction(m.data);
    else if (m.name === 'stage') announceStage(m.data);
    else if (m.name === 'hand') { RES = null; $('result').classList.remove('on'); }
  } else if (m.t === 'countdown') {
    $('msg').textContent = m.sec > 0 ? '다음 핸드까지 ' + m.sec + '초' : '';
  } else if (m.t === 'turnclock') {
    if (G.toAct === 0) $('msg').textContent = '내 차례 · ' + m.sec + '초 남음 (지나면 자동 체크/폴드)';
  } else if (m.t === 'gameover') {
    NET.lobby = m.lobby || NET.lobby;
    $('msg').innerHTML = '<b>게임 종료</b> ' + esc(m.winner || '') + ' 승리. 방장이 다시 시작할 수 있습니다.';
    $('actions').innerHTML = '';
    setTimeout(() => { $('ov').classList.add('on'); renderLobby(); }, 2500);
  } else if (m.t === 'chat') {
    chatPush(m.name, m.text, m.name === NET.name);
  } else if (m.t === 'error') {
    netStatus(m.msg, true);
  }
}
function netStatus(text, bad) {
  const el = $('netStatus');
  if (!el) return;
  el.textContent = text; el.className = 'hint' + (bad ? ' bad' : '');
}

/** 설정창의 온라인 패널 */

/* ───────── 채팅·감정표현 ───────── */
const EMOTES = ['👍', '😂', '😱', '🔥', '😎', '🙏', '💀', '🎉'];
const CHAT = { lines: [], bubbles: {} };
function bubbleFor(name) {
  const b = CHAT.bubbles[name];
  if (!b || Date.now() > b.until) return null;
  const d = document.createElement('div'); d.className = 'bubble' + (b.emote ? ' emote' : ''); d.textContent = b.text; return d;
}
function chatPush(name, text, mine) {
  const emote = EMOTES.includes(text);
  CHAT.lines.push({ name, text, mine }); if (CHAT.lines.length > 100) CHAT.lines.shift();
  CHAT.bubbles[name] = { text, emote, until: Date.now() + 3500 };
  renderChat(); render();
  setTimeout(render, 3700);
}
function renderChat() {
  const el = $('chat'); if (!el) return;
  el.innerHTML = CHAT.lines.slice(-60).map((l) => '<div class="cl' + (l.mine ? ' me' : '') + '"><b>' + esc(l.name) + '</b> ' + esc(l.text) + '</div>').join('');
  el.scrollTop = el.scrollHeight;
}
function chatSend(text) {
  text = String(text || '').trim().slice(0, 80);
  if (!text) return;
  if (!MODE.net && !NET.code) { netStatus('채팅은 온라인 방에서 쓸 수 있습니다.'); return; }
  netSend({ t: 'chat', text });
  $('inChat').value = '';
}
(function initChat() {
  const em = $('emotes'); if (!em) return;
  EMOTES.forEach((e) => { const b = document.createElement('button'); b.className = 'emote'; b.textContent = e; b.onclick = () => chatSend(e); em.appendChild(b); });
  $('btnChat').onclick = () => chatSend($('inChat').value);
  $('inChat').onkeydown = (ev) => { if (ev.key === 'Enter') chatSend($('inChat').value); };
})();

function netCreateOrJoin(code) {
  const name = ($('inName').value || '').trim().slice(0, 12);
  if (!name) { netStatus('이름을 입력하세요.', true); return; }
  const base = ($('inServer') ? $('inServer').value.trim() : '') || defaultServer();
  if (!base) { netStatus('서버 주소를 입력하세요.', true); return; }
  NET.name = name; store.set('ht.name', name); store.set('ht.server', base);
  const token = store.get('ht.token');
  netConnect(base, () => {
    if (code) netSend({ t: 'join', code: code.toUpperCase(), name, token });
    else netSend({ t: 'create', name });
  });
}

/* ───────── 렌더 ───────── */
function render() {
  $('hHand').textContent = G.handNo;
  $('pot').textContent = fmt(potTotal());
  $('stageTag').textContent = { preflop: '프리플랍', flop: '플랍', turn: '턴', river: '리버', showdown: '쇼다운' }[G.stage] || '';

  // 보드
  const bd = $('board'); bd.innerHTML = '';
  const heroBest = bestSet();
  for (let i = 0; i < 5; i++) {
    if (i < G.board.length) {
      const c = G.board[i];
      const el = cardEl(c, 'deal' + (heroBest.has(HE.cardId(c)) ? ' best' : ''));
      bd.appendChild(el);
    } else bd.appendChild(ph());
  }

  // 좌석
  document.querySelectorAll('.seat').forEach((s) => s.remove());
  const felt = $('felt');
  const opps = G.players.filter((p) => p.id !== 0);
  const n = opps.length;
  // 좌석은 펠트 안쪽에 배치한다. 반지름이 너무 크면 카드가 테이블 밖으로 나간다.
  const mob = window.innerWidth <= 720;
  const RX = mob ? 40 : 45, RY = mob ? 33 : 40, CY = mob ? 46 : 48;
  const SPAN = mob ? 196 : 200, START = mob ? 172 : 170;
  opps.forEach((p, k) => {
    const t = (START + ((k + 1) * SPAN) / (n + 1)) * Math.PI / 180;
    const x = 50 + RX * Math.cos(t), y = CY + RY * Math.sin(t);
    const idx = G.players.indexOf(p);
    const d = document.createElement('div');
    d.className = 'seat' + (idx === G.toAct ? ' turn' : '') + (p.folded ? ' folded' : '') + (p.out ? ' out' : '') + (p.online === false ? ' off' : '');
    d.style.left = x + '%'; d.style.top = y + '%';
    const cards = document.createElement('div'); cards.className = 'cards';
    if (!p.out && p.hole.length) {
      const reveal = G.showAll && !p.folded;
      p.hole.forEach((c) => cards.appendChild(cardEl(reveal ? c : null, 'sm')));
    }
    d.appendChild(cards);
    const plate = document.createElement('div'); plate.className = 'plate';
    plate.innerHTML = '<div class="nm">' + esc(p.name) + (p.styleLabel && !MODE.net ? ' <small class="sty">' + p.styleLabel + '</small>' : '') + '</div><div class="ch num">' + fmt(p.stack) + '</div>';
    d.appendChild(plate);
    if (idx === G.btn && !p.out) { const b = document.createElement('div'); b.className = 'dbtn'; b.textContent = 'D'; d.appendChild(b); }
    if (p.last) { const a = document.createElement('div'); a.className = 'act ' + actClass(p); a.textContent = p.last; d.appendChild(a); }
    if (p.bet > 0) { const bt = document.createElement('div'); bt.className = 'bet num'; bt.textContent = fmt(p.bet); d.appendChild(bt); }
    const bub = bubbleFor(p.name); if (bub) d.appendChild(bub);
    felt.appendChild(d);
  });

  // 내 자리
  const me = G.players[0];
  const hc = $('heroCards'); hc.innerHTML = '';
  if (me.hole.length) me.hole.forEach((c) => hc.appendChild(cardEl(c, 'deal' + (heroBest.has(HE.cardId(c)) ? ' best' : ''))));
  else { hc.appendChild(ph()); hc.appendChild(ph()); }
  $('heroStack').textContent = fmt(me.stack);
  $('hero').className = 'hero' + (G.toAct === 0 ? ' turn' : '');
  $('hero').querySelectorAll('.bubble').forEach((b) => b.remove());
  { const bub = bubbleFor(me.name); if (bub) $('hero').appendChild(bub); }
  const dealerMe = G.btn === 0 ? ' · 딜러' : '';
  $('heroName').textContent = (MODE.net ? esc(me.name) : '나') + dealerMe + (me.bet > 0 ? ' · 베팅 ' + fmt(me.bet) : '');
  if (me.hole.length && !me.out && me.hole[0]) {
    const bf = HE.bestFive(me.hole.concat(G.board));
    $('heroMade').innerHTML = '현재 <b>' + HE.handName(bf.score) + '</b>';
  } else $('heroMade').textContent = '';

  renderActions();
  renderAdvisor();
  renderRanks();
  renderLog();
}
const actClass = (p) => p.lastType || '';
function bestSet() {
  const me = G.players[0];
  if (!me || !me.hole.length || G.board.length < 3) return new Set();
  const bf = HE.bestFive(me.hole.concat(G.board));
  return new Set(bf.cards.map(HE.cardId));
}

function renderActions() {
  const a = $('actions'); a.innerHTML = '';
  const me = G.players[0];
  if (G.stage === 'idle' || G.stage === 'over') return showStartButton();
  if (G.toAct !== 0 || G.stage === 'showdown' || me.folded || me.out) {
    if (MODE.net && me.out) $('msg').innerHTML = '<b>관전 중</b> 칩을 모두 잃었습니다. 방장이 다시 시작하면 참여합니다.';
    else if (G.stage !== 'showdown') $('msg').textContent = G.toAct >= 0 ? G.players[G.toAct].name + ' 차례' : (MODE.net && G.stage === 'idle' ? '방장이 게임을 시작하면 카드가 옵니다' : '');
    return;
  }
  const toCall = G.maxBet - me.bet;
  $('msg').textContent = toCall > 0 ? '콜 하려면 ' + fmt(Math.min(toCall, me.stack)) + ' 필요' : '베팅 없음, 체크 가능';

  const mk = (label, cls, fn, dis) => {
    const b = document.createElement('button');
    b.className = 'abtn ' + cls; b.textContent = label; b.disabled = !!dis; b.onclick = fn;
    a.appendChild(b); return b;
  };
  mk('폴드', 'fold', () => doAction(0, 'fold'));
  if (toCall === 0) mk('체크', '', () => doAction(0, 'check'));
  else mk('콜 ' + fmt(Math.min(toCall, me.stack)), 'call', () => doAction(0, 'call'));

  // 베팅 버튼: 슬라이더 대신 포커 앱처럼 정해진 크기를 바로 누른다
  const minTo = Math.min(G.maxBet + G.minRaise, me.bet + me.stack);   // 삥 = 최소 벳/레이즈
  const maxTo = me.bet + me.stack;
  const pot = potTotal();
  const step = STEP();
  const snap = (v) => Math.max(minTo, Math.min(maxTo, Math.round(v / step) * step));
  if (maxTo > G.maxBet) {
    const box = document.createElement('div'); box.className = 'betbox';
    const sizes = [
      ['삥', minTo],
      G.maxBet > 0 ? ['따당', G.maxBet * 2] : null,
      ['쿼터', G.maxBet + Math.round((pot + toCall) / 4)],
      ['하프', G.maxBet + Math.round((pot + toCall) / 2)],
      ['풀', G.maxBet + pot + toCall],
    ].filter(Boolean).map(([l, v]) => [l, snap(v)]);
    const seen = new Set();
    sizes.forEach(([l, v]) => {
      if (v >= maxTo || seen.has(v)) return;           // 올인과 같거나 중복이면 생략
      seen.add(v);
      const bb = document.createElement('button');
      bb.className = 'abtn bet'; bb.innerHTML = l + '<small>' + fmt(v) + '</small>';
      bb.onclick = () => doAction(0, 'raise', v);
      box.appendChild(bb);
    });
    if (box.children.length) a.appendChild(box);
  }
  mk('올인 ' + fmt(me.stack), 'allin', () => doAction(0, 'raise', me.bet + me.stack));
}

/* ───────── 어드바이저 ───────── */
function renderAdvisor() {
  const box = $('advBox');
  if (MODE.net) { $('advState').textContent = 'OFF'; $('btnAdv').style.display = 'none'; box.innerHTML = '<div class="adv-off">온라인 대전에서는 어드바이저를 쓰지 않습니다.</div>'; return; }
  $('btnAdv').style.display = '';
  $('advState').textContent = CFG.advisor ? 'ON' : 'OFF';
  if (!CFG.advisor) { box.innerHTML = '<div class="adv-off">어드바이저 꺼짐<br>설정에서 켤 수 있습니다.</div>'; return; }
  const me = G.players[0];
  if (!me.hole.length || me.folded || me.out || G.stage === 'idle') {
    box.innerHTML = '<div class="adv-off">핸드 진행 중에 표시됩니다.</div>'; return;
  }
  const opp = Math.max(1, inHand().length - 1);
  const bf = HE.bestFive(me.hole.concat(G.board));
  const eq = HE.equity(me.hole, G.board, opp, 2600);
  const ou = HE.outs(me.hole, G.board);
  const toCall = G.maxBet - me.bet;
  const pot = potTotal();
  const potOdds = toCall > 0 ? toCall / (pot + toCall) : 0;
  const left = 5 - G.board.length;
  const outP = ou.n ? (left >= 2 ? Math.min(0.95, ou.n * 4 / 100) : ou.n * 2 / 100) : 0;

  let head = '', why = '';
  if (G.board.length === 0) {
    /* ── 프리플랍: 시작 핸드 해설 ── */
    const hc = HE.handClass(me.hole);
    const eq1 = HE.equity(me.hole, [], 1, 1800);
    head = '<div class="advhand"><span class="lb">' + hc.label + '</span>' +
      '<span class="tier ' + hc.tier + '">' + TIER_LABEL[hc.tier] + '</span>' +
      '<span class="nk">' + nickname(hc) + '</span></div>';
    why = preflopWhy(hc, eq1, opp, eq);
  } else {
    /* ── 플랍 이후: 지금 손의 강도와 위험 ── */
    const bh = HE.beatingHands(me.hole, G.board);
    const tex = HE.boardTexture(G.board);
    const ratio = bh ? bh.beat / bh.total : 0;
    const strength = ratio < 0.01 ? ['사실상 최강', 'S'] : ratio < 0.05 ? ['매우 강함', 'A']
      : ratio < 0.15 ? ['강한 편', 'B'] : ratio < 0.35 ? ['중간', 'C'] : ['약함', 'D'];
    head = '<div class="advhand"><span class="lb">' + HE.handName(bf.score) + '</span>' +
      '<span class="tier ' + strength[1] + '">' + strength[0] + '</span></div>';
    why = postflopWhy(bf, bh, tex, ou, outP, left, opp);
  }

  let rows = '';
  const row = (k, v) => { rows += '<div class="advrow"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; };
  row('승률 (' + opp + '명 상대)', (eq * 100).toFixed(1) + '<small>%</small>');
  if (G.board.length < 5 && ou.n) row('아웃츠', ou.n + '<small>장</small> · 개선 ' + (outP * 100).toFixed(0) + '<small>%</small>');
  if (toCall > 0) row('팟오즈', (potOdds * 100).toFixed(1) + '<small>% 이상 필요</small>');

  let verdict = '', vc = 'mid';
  if (toCall === 0) {
    if (eq > 0.62) { verdict = '승률이 높습니다. 벳으로 팟을 키울 자리입니다.'; vc = 'go'; }
    else { verdict = '공짜로 다음 카드를 봅니다. 체크가 무난합니다.'; vc = 'mid'; }
  } else if (eq >= potOdds + 0.12) { verdict = '승률 ' + (eq * 100).toFixed(0) + '%가 필요 승률 ' + (potOdds * 100).toFixed(0) + '%를 크게 넘습니다. 콜 또는 레이즈가 유리합니다.'; vc = 'go'; }
  else if (eq >= potOdds) { verdict = '승률이 필요 승률보다 조금 높습니다. 콜 가치가 있습니다.'; vc = 'mid'; }
  else { verdict = '승률 ' + (eq * 100).toFixed(0) + '%가 필요 승률 ' + (potOdds * 100).toFixed(0) + '%에 못 미칩니다. 폴드가 손실을 줄입니다.'; vc = 'no'; }

  let ol = '';
  if (G.board.length >= 3 && G.board.length < 5) {
    const o = HE.outlook(me.hole, G.board);
    const top = o.dist.filter((x) => x.p >= 0.005).slice(0, 5);
    const mx = Math.max(...top.map((x) => x.p), 0.001);
    ol = '<div class="outlook"><div style="font-size:11.5px;color:var(--ink-2);margin-bottom:5px">리버까지 완성 가능한 족보</div>' +
      top.map((x) => '<div class="olrow"><span>' + HE.CATS[x.cat].ko + '</span>' +
        '<span class="bar"><i style="width:' + (x.p / mx * 100) + '%"></i></span>' +
        '<span class="p">' + (x.p * 100).toFixed(1) + '%</span></div>').join('') + '</div>';
  }

  box.innerHTML = head + why + rows +
    '<div class="meter"><i style="width:' + (eq * 100).toFixed(1) + '%"></i></div>' +
    '<div class="verdict ' + vc + '">' + verdict + '</div>' + ol;
}

const TIER_LABEL = { S: '최상위', A: '강함', B: '괜찮음', C: '보통', D: '약함' };
const RK = HE.rankName;

function nickname(hc) {
  if (hc.pair) return '포켓 ' + (hc.hi === 14 ? '에이스' : hc.hi === 13 ? '킹' : hc.hi === 12 ? '퀸' : hc.hi === 11 ? '잭' : RK(hc.hi));
  if (hc.hi === 14 && hc.lo === 13) return '빅 슬릭';
  if (hc.suited && hc.gap === 1) return '수티드 커넥터';
  if (hc.suited && hc.hi === 14) return '수티드 에이스';
  if (hc.suited) return '수티드';
  if (hc.hi >= 12 && hc.lo >= 10) return '브로드웨이';
  return '오프수트';
}

/** 프리플랍 해설: 왜 강한지, 무엇에 지는지, 무엇을 조심할지 */
function preflopWhy(hc, eq1, opp, eqNow) {
  const p = [];
  const pct = (x) => (x * 100).toFixed(0) + '%';
  if (hc.pair && hc.hi === 14) {
    p.push('169개 시작 핸드 중 <b>1위</b>입니다. 프리플랍에서 이 손을 이기는 시작 핸드는 <b>없습니다</b>.');
    p.push('다만 상대가 많아질수록 승률이 빠르게 떨어집니다. 1명 상대 ' + pct(eq1) + ', 지금 ' + opp + '명 상대로는 ' + pct(eqNow) + '. <b>레이즈로 상대 수를 줄이는 것</b>이 정석입니다.');
    p.push('지는 경우는 대부분 플랍 이후입니다. 상대가 <b>셋(트리플)</b>을 만들거나 보드에 스트레이트·플러시가 깔릴 때 조심하세요.');
  } else if (hc.pair && hc.hi === 13) {
    p.push('AA 다음으로 강한 손입니다. 프리플랍에서 지는 상대는 <b>AA뿐</b>이며, 그 확률은 매우 낮습니다.');
    p.push('보드에 <b>A가 깔리면</b> 상대의 에이스 페어에 밀릴 수 있으니 그때부터는 신중하게 진행하세요.');
  } else if (hc.pair && hc.hi >= 11) {
    p.push('상위 포켓페어로 충분히 강합니다. 프리플랍에서 앞서는 손은 <b>더 높은 포켓페어</b>뿐입니다.');
    p.push('보드에 <b>' + (hc.hi === 12 ? 'A나 K' : 'A·K·Q') + '가 깔리면</b> 상대의 오버카드 페어에 역전될 수 있습니다.');
  } else if (hc.pair) {
    p.push('작은 포켓페어입니다. 그 자체로는 약하지만 <b>플랍에서 셋이 되면</b> 매우 강해집니다(확률 약 12%).');
    p.push('싸게 플랍을 보고 셋이 안 되면 미련 없이 접는 전략이 기본입니다.');
  } else if (hc.hi === 14 && hc.lo === 13) {
    p.push('페어가 아닌 손 중 <b>가장 강합니다</b>. 탑페어가 되면 킥커 싸움에서 거의 지지 않습니다.' + (hc.suited ? ' 수티드라 <b>넛 플러시</b> 가능성까지 있습니다.' : ''));
    p.push('단점은 <b>맞지 않으면 그냥 A 하이</b>라는 점입니다. 플랍에서 미스했다면 과감히 접을 줄 알아야 합니다.');
  } else if (hc.hi === 14) {
    p.push(hc.suited ? '수티드 에이스입니다. <b>플러시가 되면 최상위(넛)</b>가 됩니다.' : '에이스를 든 손입니다. 페어가 되면 강하지만 <b>킥커가 낮아</b> 같은 에이스끼리 붙으면 밀립니다.');
    p.push('낮은 카드로 페어를 맞췄을 때 무리하지 않는 것이 중요합니다.');
  } else if (hc.suited && hc.gap <= 2) {
    p.push('수티드 커넥터입니다. 당장은 약해 보여도 <b>스트레이트·플러시 잠재력</b>이 큽니다.');
    p.push('여러 명이 들어온 큰 팟에서 값싸게 볼 때 가치가 높고, 완성되지 않으면 쉽게 접어야 합니다.');
  } else if (hc.hi >= 12 && hc.lo >= 10) {
    p.push('브로드웨이 카드 조합입니다. 탑페어를 만들면 쓸 만하지만 <b>킥커 문제</b>로 역전당하기 쉽습니다.');
  } else {
    p.push('<b>가장 약한 축</b>의 시작 핸드입니다. 1명 상대 승률도 ' + pct(eq1) + ' 수준입니다.');
    p.push('장기적으로는 <b>프리플랍에서 접는 것</b>이 칩을 아끼는 길입니다.');
  }
  return p.map((t) => '<p class="why">' + t + '</p>').join('');
}

/** 플랍 이후 해설: 나를 이기는 조합과 보드 위험 */
function postflopWhy(bf, bh, tex, ou, outP, left, opp) {
  const p = [];
  if (bh) {
    const pctBeat = bh.beat / bh.total * 100;
    const catNames = Object.entries(bh.cats).sort((a, b) => b[1] - a[1]).slice(0, 3)
      .map(([c]) => HE.CATS[c].ko);
    if (bh.beat === 0) {
      p.push('현재 이 보드에서 <b class="safe">나를 이길 수 있는 조합이 없습니다</b>. 최대한 팟을 키울 자리입니다.');
    } else {
      p.push('상대가 가질 수 있는 <b>' + fmt(bh.total) + '개 조합 중 ' + fmt(bh.beat) + '개(' + pctBeat.toFixed(1) + '%)</b>가 나를 이깁니다.' +
        (catNames.length ? ' 주로 <b>' + catNames.join(', ') + '</b>입니다.' : ''));
    }
    p.push('단, 이는 <b>상대 1명 기준</b>입니다. 상대가 ' + opp + '명이면 그중 누군가 그 조합을 들고 있을 가능성이 그만큼 커집니다.');
  }
  if (ou.n && left > 0) {
    p.push('아직 <b>' + ou.n + '장</b>이 남아 있어 ' + (left >= 2 ? '리버까지 약 ' : '리버에서 약 ') +
      '<b>' + (outP * 100).toFixed(0) + '%</b> 확률로 지금보다 좋은 족보가 됩니다. (아웃츠 × ' + (left >= 2 ? 4 : 2) + '로 어림잡는 방법)');
  }
  let tags = '';
  if (tex.notes.length) tags = '<div class="tags">' + tex.notes.map((n) => '<span class="tag">' + n + '</span>').join('') + '</div>';
  else tags = '<div class="tags"><span class="tag ok">위험 요소 적은 보드</span></div>';
  return p.map((t) => '<p class="why">' + t + '</p>').join('') + tags;
}

/* ───────── 족보표 ───────── */
const RANK_EX = [
  [9, 'As Ks Qs Js Ts'], [8, '9h 8h 7h 6h 5h'], [7, 'Ks Kh Kd Kc 3s'], [6, 'Js Jh Jd 8s 8h'],
  [5, 'Ad Jd 9d 6d 3d'], [4, 'Ts 9h 8d 7c 6s'], [3, '7s 7h 7d Ks 2h'], [2, 'As Ah 9d 9c 4s'],
  [1, 'Qs Qh 8d 5c 2s'], [0, 'As Jh 9d 6c 3s'],
];
const PS = { s: 0, h: 1, d: 2, c: 3 }, PR = { T: 10, J: 11, Q: 12, K: 13, A: 14 };
const parseC = (t) => ({ r: PR[t[0]] || +t[0], s: PS[t[1]] });
function renderRanks() {
  const me = G.players[0];
  let cur = -1;
  if (me && me.hole && me.hole.length) cur = HE.catOf(HE.bestFive(me.hole.concat(G.board)).score);
  $('ranks').innerHTML = RANK_EX.map(([cat, ex], i) =>
    '<div class="rank' + (cat === cur ? ' hit' : '') + '"><span class="no num">' + (i + 1) + '</span>' +
    '<span class="nm">' + HE.CATS[cat].ko + '</span><span class="ex">' +
    ex.split(' ').map((t) => { const c = parseC(t); return '<span class="card xs' + (RED(c.s) ? ' red' : '') + '"><span class="rk">' + HE.rankName(c.r) + '</span><span class="st">' + SUIT[c.s] + '</span></span>'; }).join('') +
    '</span></div>').join('');
}

/* ───────── 로그 ───────── */
function logLine(t, cls) { G.log.push({ t, cls }); if (G.log.length > 200) G.log.shift(); }
function renderLog() {
  const el = $('log');
  el.innerHTML = G.log.slice(-60).map((l) => '<div class="' + (l.cls || '') + '">' + l.t + '</div>').join('');
  el.scrollTop = el.scrollHeight;
}

/* ───────── 설정 ───────── */
function buildOpts() {
  const mk = (host, items, get, set) => {
    const h = $(host); h.innerHTML = '';
    items.forEach(([val, label, sub]) => {
      const b = document.createElement('button');
      b.className = 'opt' + (get() === val ? ' on' : '');
      b.innerHTML = label + (sub ? '<small>' + sub + '</small>' : '');
      b.onclick = () => { set(val); buildOpts(); };
      h.appendChild(b);
    });
  };
  mk('optOpp', [1, 2, 3, 4, 5, 6, 7, 8].map((n) => [n, n + '명']), () => CFG.opp, (v) => CFG.opp = v);
  mk('optDiff', [['easy', '초급', '느슨하게 콜'], ['normal', '중급', '확률 기반'], ['hard', '고수', '위치·블러프'], ['pro', '프로', '3벳·트랩·세미블러프'], ['mix', '섞기', '봇마다 성향 다름']], () => CFG.diff, (v) => CFG.diff = v);
  mk('optAdv', [[true, '받기', '승률·추천 표시'], [false, '안받기', '혼자 판단']], () => CFG.advisor, (v) => CFG.advisor = v);
  mk('optSpeed', [['slow', '느리게', '흐름 파악용'], ['normal', '보통', ''], ['fast', '빠르게', '익숙해지면']], () => CFG.speed, (v) => CFG.speed = v);
  mk('optTurn', [[0, '무제한'], [5, '5초'], [10, '10초'], [15, '15초'], [30, '30초'], [60, '60초']], () => CFG.turn, (v) => CFG.turn = v);
  mk('optStack', [[10000, '1만'], [20000, '2만'], [50000, '5만'], [100000, '10만']], () => CFG.stack, (v) => { CFG.stack = v; syncStake(); });
  mk('optBB', [[100, '100'], [200, '200'], [500, '500'], [1000, '1,000']], () => CFG.bb, (v) => { CFG.bb = v; syncStake(); });
  syncStake();
}

/** 시작 칩 / 최소 베팅 입력칸 동기화 및 검증 */
function syncStake() {
  const s = $('inStack'), b = $('inBB');
  if (s.value != CFG.stack) s.value = CFG.stack;
  if (b.value != CFG.bb) b.value = CFG.bb;
  const ratio = Math.floor(CFG.stack / CFG.bb);
  let msg = '스몰블라인드 ' + fmt(SB()) + ' · 시작 칩이 최소 베팅의 ' + fmt(ratio) + '배';
  if (ratio < 10) msg += ' (너무 적어 금방 올인이 됩니다)';
  $('bbHint').textContent = msg;
}
function clampStake() {
  CFG.stack = Math.max(100, Math.min(10000000, Math.round(+$('inStack').value || 10000)));
  CFG.bb = Math.max(2, Math.min(Math.floor(CFG.stack / 2), Math.round(+$('inBB').value || 100)));
}
$('inStack').oninput = () => { clampStake(); syncStake(); buildOpts(); };
$('inBB').oninput = () => { clampStake(); syncStake(); buildOpts(); };
$('inStack').onblur = () => { clampStake(); syncStake(); buildOpts(); };
$('inBB').onblur = () => { clampStake(); syncStake(); buildOpts(); };

/* 모바일 하단 탭: 사이드 패널을 시트로 열고 섹션 전환 */
const isMobile = () => window.innerWidth <= 1080;
document.querySelectorAll('#mtabs button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('#mtabs button').forEach((x) => x.classList.toggle('on', x === b));
    const sec = b.dataset.sec, side = $('side');
    if (sec === 'game') { side.classList.remove('open'); return; }
    side.classList.add('open');
    document.querySelectorAll('#side .sec').forEach((s) => { s.style.display = s.dataset.sec === sec ? '' : 'none'; });
    side.scrollTop = 0;
  };
});
window.addEventListener('resize', () => {
  if (!isMobile()) {
    $('side').classList.remove('open');
    document.querySelectorAll('#side .sec').forEach((s) => { s.style.display = ''; });
  }
});
$('btnStart').onclick = () => { $('ov').classList.remove('on'); newGame(); };
function setModeTab(mode) {
  $('ov').querySelector('.modal').classList.toggle('online', mode === 'net');
  $('tabLocal').classList.toggle('on', mode === 'local');
  $('tabNet').classList.toggle('on', mode === 'net');
  if (mode === 'net') { $('serverFld').style.display = (location.protocol === 'http:' || location.protocol === 'https:') ? 'none' : ''; renderLobby(); }
}
$('tabLocal').onclick = () => setModeTab('local');
$('tabNet').onclick = () => setModeTab('net');
$('btnCreate').onclick = () => netCreateOrJoin('');
$('btnJoin').onclick = () => netCreateOrJoin($('inCode').value.trim());
$('inCode').onkeydown = (e) => { if (e.key === 'Enter') netCreateOrJoin($('inCode').value.trim()); };
(function initNet() {
  if (typeof location === 'undefined') return;
  $('inName').value = store.get('ht.name');
  if ($('inServer')) $('inServer').value = store.get('ht.server');
  const q = new URLSearchParams(location.search);
  const room = (q.get('room') || '').toUpperCase();
  const saved = store.get('ht.room');
  if (room) { setModeTab('net'); $('inCode').value = room; if ($('inName').value) netCreateOrJoin(room); else netStatus('이름을 입력하고 참가를 누르세요.'); }
  else if (saved && store.get('ht.token')) { setModeTab('net'); $('inCode').value = saved; netCreateOrJoin(saved); }
})();
$('btnSet').onclick = () => { buildOpts(); $('ov').classList.add('on'); };
$('btnAdv').onclick = () => {
  CFG.advisor = !CFG.advisor;
  $('btnAdv').textContent = '어드바이저 ' + (CFG.advisor ? 'ON' : 'OFF');
  $('btnAdv').classList.toggle('on', CFG.advisor);
  renderAdvisor();
};

buildOpts();
renderRanks();
$('btnAdv').classList.toggle('on', CFG.advisor);
// 홈 화면 앱(PWA): http(s)로 열렸을 때만 등록
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && typeof location !== 'undefined' && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
