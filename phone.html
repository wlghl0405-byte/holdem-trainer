<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>육지덤 · 폰 화면 미리보기</title>
<style>
  html,body{margin:0;height:100%;background:#070908;color:#93A09A;font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
  .bar{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .bar b{color:#E9EDEB;font-weight:700}
  .bar a,.bar button{color:#D4AF37;border:1px solid #313C40;border-radius:9px;padding:6px 12px;background:#1A2124;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}
  .bar a:hover,.bar button:hover{border-color:#D4AF37}
  /* 폰 프레임: 아이폰 크기(390×844)에 상단 상태바·하단 홈 인디케이터 여백 */
  .device{width:390px;height:844px;max-height:calc(100vh - 80px);border-radius:44px;background:#000;border:10px solid #1C1F1E;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px #2A2E2D;position:relative;overflow:hidden}
  .device iframe{border:0;width:100%;height:100%;display:block;background:#0B0E0D}
  .notch{position:absolute;left:50%;top:0;transform:translateX(-50%);width:120px;height:26px;background:#000;border-radius:0 0 18px 18px;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><b>폰 화면 미리보기</b><span>390 × 844</span><button id="w360">360</button><button id="w390">390</button><button id="w430">430</button><a id="toPc" href="./">PC 화면으로</a></div>
  <div class="device" id="device"><div class="notch"></div><iframe id="app" title="육지덤"></iframe></div>
</div>
<script>
  // 같은 방·같은 자리로 이어진다 (이름·토큰은 브라우저 저장소를 함께 쓴다)
  const q = location.search || '';
  document.getElementById('app').src = './' + q;
  document.getElementById('toPc').href = './' + q;
  const dev = document.getElementById('device');
  [360, 390, 430].forEach((w) => { document.getElementById('w' + w).onclick = () => { dev.style.width = w + 'px'; }; });
</script>
</body>
</html>
